<!-- ════════════════════════════════════════════════════════════════════════
     My Tenants section
     ──────────────────────────────────────────────────────────────────────
     - Header card: counts + search + sort + refresh
     - Tenant roster: per-tenant rows with avatar, name, store, order
       stats, wallet, unread message badge, last message preview, and an
       "Open chat" button that jumps to the chat section.
     - Loading / error / empty states all handled in-section.
     ──────────────────────────────────────────────────────────────────── -->
<div id="opsMyTenantsRoot" data-ready="0">
  <div class="ops-loading">Loading your tenant roster…</div>
</div>

<style>
  /* ── Section-scoped tokens ─────────────────────────────────────── */
  #opsMyTenantsRoot{
    --mt-card-bg:#fff;
    --mt-shadow:0 1px 0 rgba(15,23,42,.02),0 18px 38px -26px rgba(15,23,42,.22);
  }

  /* ── Header card ───────────────────────────────────────────────── */
  #opsMyTenantsRoot .mt-header{
    background:#fff;border:1px solid var(--ops-border);border-radius:18px;
    padding:18px 20px;margin-bottom:16px;position:relative;overflow:hidden;
    box-shadow:var(--mt-shadow);
  }
  #opsMyTenantsRoot .mt-header::before{
    content:"";position:absolute;left:0;top:14px;width:4px;height:14px;border-radius:3px;
    background:linear-gradient(180deg,var(--ops-gold) 0%,var(--ops-gold-2) 50%,var(--ops-violet) 100%);
    box-shadow:0 0 12px rgba(244,196,48,.5);
  }
  #opsMyTenantsRoot .mt-header-inner{padding-left:14px;}
  #opsMyTenantsRoot .mt-htitle{
    font-size:15px;font-weight:900;color:var(--ops-text);letter-spacing:-.01em;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  #opsMyTenantsRoot .mt-hsub{
    font-size:11.5px;color:var(--ops-text-2);font-weight:600;margin-top:3px;
  }
  #opsMyTenantsRoot .mt-hkpi{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;
    background:rgba(99,102,241,.1);color:var(--ops-violet);
  }
  #opsMyTenantsRoot .mt-hkpi.gold{background:rgba(212,175,55,.14);color:#9a7700;}
  #opsMyTenantsRoot .mt-hkpi.red{background:rgba(239,68,68,.12);color:var(--ops-red);}

  /* ── Toolbar ───────────────────────────────────────────────────── */
  #opsMyTenantsRoot .mt-toolbar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    margin-top:14px;
  }
  #opsMyTenantsRoot .mt-search{flex:1;min-width:220px;position:relative;}
  #opsMyTenantsRoot .mt-search input{
    width:100%;padding:9px 14px 9px 36px;border-radius:10px;
    border:1px solid #e5e7eb;background:#f8fafc;font-size:13px;
    font-weight:600;color:var(--ops-text);outline:none;
    transition:border-color .12s,background .12s,box-shadow .12s;
    font-family:inherit;
  }
  #opsMyTenantsRoot .mt-search input:focus{
    border-color:var(--ops-violet);background:#fff;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  #opsMyTenantsRoot .mt-search::before{
    content:"🔎";position:absolute;left:11px;top:50%;
    transform:translateY(-50%);font-size:13px;opacity:.7;pointer-events:none;
  }
  #opsMyTenantsRoot .mt-sort{
    padding:9px 12px;border-radius:10px;border:1px solid #e5e7eb;
    background:#fff;font-weight:700;font-size:12.5px;color:var(--ops-text);
    cursor:pointer;font-family:inherit;
  }
  #opsMyTenantsRoot .mt-sort:focus{outline:none;border-color:var(--ops-violet);}

  /* ── List ──────────────────────────────────────────────────────── */
  #opsMyTenantsRoot .mt-list{
    display:grid;gap:12px;
    grid-template-columns:1fr;
  }
  #opsMyTenantsRoot .mt-row{
    background:var(--mt-card-bg);border:1px solid var(--ops-border);
    border-radius:16px;padding:14px 18px;display:grid;
    grid-template-columns:54px 1fr auto;gap:14px;align-items:center;
    box-shadow:var(--mt-shadow);
    transition:transform .15s,box-shadow .15s,border-color .15s;
    position:relative;overflow:hidden;cursor:pointer;
  }
  #opsMyTenantsRoot .mt-row:hover{
    transform:translateY(-1px);border-color:rgba(99,102,241,.22);
    box-shadow:0 18px 38px -18px rgba(15,23,42,.28);
  }
  #opsMyTenantsRoot .mt-row.unread::before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
    background:linear-gradient(180deg,var(--ops-gold),var(--ops-gold-2));
    border-radius:3px;box-shadow:0 0 10px rgba(244,196,48,.5);
  }

  #opsMyTenantsRoot .mt-av{
    width:54px;height:54px;border-radius:14px;display:flex;align-items:center;
    justify-content:center;font-weight:900;color:#fff;font-size:18px;
    background:linear-gradient(135deg,var(--ops-violet) 0%,var(--ops-violet-2) 100%);
    box-shadow:0 6px 16px -6px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.18);
    letter-spacing:-.02em;flex-shrink:0;position:relative;overflow:hidden;
  }
  #opsMyTenantsRoot .mt-av img{width:100%;height:100%;object-fit:cover;}
  #opsMyTenantsRoot .mt-av .flag{
    position:absolute;bottom:-2px;right:-2px;font-size:14px;
    background:#fff;border-radius:50%;width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(15,23,42,.18);
  }

  #opsMyTenantsRoot .mt-body{min-width:0;}
  #opsMyTenantsRoot .mt-headline{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  #opsMyTenantsRoot .mt-name{
    font-size:14.5px;font-weight:900;color:var(--ops-text);letter-spacing:-.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
  }
  #opsMyTenantsRoot .mt-name .flag-inline{font-size:14px;margin-left:4px;}
  #opsMyTenantsRoot .mt-email{
    font-size:11.5px;color:var(--ops-text-2);font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
  }
  #opsMyTenantsRoot .mt-unread-pill{
    background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;
    font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;
    box-shadow:0 4px 10px -3px rgba(239,68,68,.5);
    display:inline-flex;align-items:center;gap:5px;
  }
  #opsMyTenantsRoot .mt-unread-pill .dot{
    width:5px;height:5px;border-radius:50%;background:#fff;
    box-shadow:0 0 6px #fff;animation:mtPulse 1.6s ease-in-out infinite;
  }
  @keyframes mtPulse{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.4);opacity:.6;}
  }

  #opsMyTenantsRoot .mt-meta{
    margin-top:6px;font-size:11.5px;color:var(--ops-text-2);font-weight:600;
    display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;
    font-variant-numeric:tabular-nums;
  }
  #opsMyTenantsRoot .mt-meta .sep{color:rgba(15,23,42,.18);}
  #opsMyTenantsRoot .mt-meta .v{color:var(--ops-text);font-weight:800;}
  #opsMyTenantsRoot .mt-meta .wallet{color:#9a7700;}

  #opsMyTenantsRoot .mt-last{
    margin-top:6px;font-size:12px;color:var(--ops-text-2);
    display:flex;gap:8px;align-items:baseline;
  }
  #opsMyTenantsRoot .mt-last .quote{
    color:var(--ops-text);font-weight:600;font-style:italic;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;
  }
  #opsMyTenantsRoot .mt-last .when{color:var(--ops-muted);font-weight:700;font-size:11px;flex-shrink:0;}

  #opsMyTenantsRoot .mt-assigned{
    margin-top:4px;font-size:10.5px;color:var(--ops-muted);font-weight:700;
    letter-spacing:.02em;
  }

  #opsMyTenantsRoot .mt-actions{
    display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  }

  /* ── Skeleton loader rows ──────────────────────────────────────── */
  #opsMyTenantsRoot .mt-skel{
    background:#fff;border:1px solid var(--ops-border);border-radius:16px;
    padding:14px 18px;display:grid;grid-template-columns:54px 1fr 100px;gap:14px;align-items:center;
  }
  #opsMyTenantsRoot .mt-skel .blk{
    background:linear-gradient(90deg,#eef1f6 0%,#f7f9fc 50%,#eef1f6 100%);
    background-size:200% 100%;animation:mtSkel 1.4s ease infinite;border-radius:8px;
  }
  @keyframes mtSkel{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  #opsMyTenantsRoot .mt-skel .av{width:54px;height:54px;border-radius:14px;}
  #opsMyTenantsRoot .mt-skel .bar1{height:14px;width:55%;margin-bottom:6px;}
  #opsMyTenantsRoot .mt-skel .bar2{height:11px;width:80%;margin-bottom:6px;}
  #opsMyTenantsRoot .mt-skel .bar3{height:11px;width:40%;}
  #opsMyTenantsRoot .mt-skel .btn{height:34px;width:100px;border-radius:10px;}

  /* ── Error / empty states ──────────────────────────────────────── */
  #opsMyTenantsRoot .mt-empty{
    background:#fff;border:1px dashed rgba(15,23,42,.12);border-radius:18px;
    padding:48px 24px;text-align:center;color:var(--ops-text-2);
  }
  #opsMyTenantsRoot .mt-empty .ic{
    font-size:42px;margin-bottom:10px;
    background:linear-gradient(135deg,#d4af37,#a855f7);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;
  }
  #opsMyTenantsRoot .mt-empty h3{margin:0 0 6px;font-size:16px;font-weight:900;color:var(--ops-text);}
  #opsMyTenantsRoot .mt-empty p{margin:0;font-size:12.5px;}

  /* ── Mobile / narrow widths ────────────────────────────────────── */
  @media (max-width: 720px){
    #opsMyTenantsRoot .mt-row{grid-template-columns:48px 1fr;gap:12px;padding:12px 14px;}
    #opsMyTenantsRoot .mt-av{width:48px;height:48px;border-radius:12px;font-size:16px;}
    #opsMyTenantsRoot .mt-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;}
    #opsMyTenantsRoot .mt-search{min-width:100%;}
  }
</style>

<script>
  (function(){
    'use strict';

    /* ───── Section state ───── */
    const MT = {
      data: null,
      filter: '',
      sort: 'unread',  // unread | active | newest | wallet | recent
      booted: false,
    };

    /* ───── Helpers ───── */
    function mtInitials(name){
      const s = String(name || '').trim();
      if (!s) return '?';
      const parts = s.split(/\s+/).slice(0,2);
      return parts.map(p => p.charAt(0) || '').join('').toUpperCase() || s.charAt(0).toUpperCase();
    }

    function mtTimeAgo(iso){
      if (!iso) return '';
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return '';
      const diff = Math.max(0, Date.now() - t);
      const m = Math.floor(diff/60000);
      if (m < 1)  return 'just now';
      if (m < 60) return m + ' min ago';
      const h = Math.floor(m/60);
      if (h < 24) return h + ' h ago';
      const d = Math.floor(h/24);
      if (d < 7)  return d + ' d ago';
      const w = Math.floor(d/7);
      if (w < 5)  return w + ' wk ago';
      const mo = Math.floor(d/30);
      if (mo < 12) return mo + ' mo ago';
      return Math.floor(d/365) + ' y ago';
    }

    function mtAssignedSince(iso){
      if (!iso) return '';
      const t = Date.parse(iso);
      if (Number.isNaN(t)) return '';
      try {
        return new Date(t).toLocaleDateString(undefined, { year:'numeric', month:'short', day:'numeric' });
      } catch (_e) { return iso.slice(0,10); }
    }

    /* ───── Sort + filter ───── */
    function mtApplyFilter(tenants){
      const q = MT.filter.trim().toLowerCase();
      if (!q) return tenants.slice();
      return tenants.filter(t => {
        const hay = [
          t.display_name, t.username, t.email,
          (t.stores || []).map(s => s.name).join(' '),
        ].filter(Boolean).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    function mtApplySort(tenants){
      const a = tenants.slice();
      switch (MT.sort){
        case 'active':
          a.sort((x,y) => (y.order_count_active||0) - (x.order_count_active||0));
          break;
        case 'newest':
          a.sort((x,y) => (Date.parse(y.assigned_at_iso) || 0) - (Date.parse(x.assigned_at_iso) || 0));
          break;
        case 'wallet':
          a.sort((x,y) => (y.wallet_balance_usd||0) - (x.wallet_balance_usd||0));
          break;
        case 'recent':
          a.sort((x,y) => (Date.parse(y.last_message_iso) || 0) - (Date.parse(x.last_message_iso) || 0));
          break;
        case 'unread':
        default:
          a.sort((x,y) => {
            const u = (y.unread_messages||0) - (x.unread_messages||0);
            if (u !== 0) return u;
            return (Date.parse(y.last_message_iso) || 0) - (Date.parse(x.last_message_iso) || 0);
          });
      }
      return a;
    }

    /* ───── Renderers ───── */
    function mtRenderHeader(){
      const d = MT.data || {};
      const tc = d.tenant_count != null ? d.tenant_count : (d.tenants ? d.tenants.length : 0);
      const ac = d.active_conversations || 0;
      const unread = (d.tenants || []).reduce((s,t) => s + (t.unread_messages || 0), 0);
      const acts = document.getElementById('opsSectionActions');
      if (acts){
        acts.innerHTML = `
          <button class="ops-btn ghost" id="opsMyTenantsRefresh">↻ Refresh</button>
        `;
        const btn = document.getElementById('opsMyTenantsRefresh');
        if (btn) btn.onclick = () => window.opsLoadMyTenants();
      }
      return `
        <div class="mt-header">
          <div class="mt-header-inner">
            <div class="mt-htitle">
              Your dedicated tenant roster
              <span class="mt-hkpi gold">${tc} ${tc === 1 ? 'tenant' : 'tenants'}</span>
              <span class="mt-hkpi">${ac} active conversation${ac === 1 ? '' : 's'}</span>
              ${unread > 0 ? `<span class="mt-hkpi red">${unread} unread</span>` : ''}
            </div>
            <div class="mt-hsub">
              You are the dedicated sourcing manager for these accounts — new tenants will appear here automatically.
            </div>
            <div class="mt-toolbar">
              <div class="mt-search">
                <input id="opsMyTenantsSearch" type="text" placeholder="Search by name, email, store…"
                       value="${opsEsc(MT.filter)}" autocomplete="off">
              </div>
              <select class="mt-sort" id="opsMyTenantsSort">
                <option value="unread"${MT.sort==='unread'?' selected':''}>Unread first</option>
                <option value="active"${MT.sort==='active'?' selected':''}>Most active</option>
                <option value="newest"${MT.sort==='newest'?' selected':''}>Newest assigned</option>
                <option value="wallet"${MT.sort==='wallet'?' selected':''}>Wallet · high to low</option>
                <option value="recent"${MT.sort==='recent'?' selected':''}>Last message</option>
              </select>
            </div>
          </div>
        </div>`;
    }

    function mtRenderRow(t){
      const flag = t.flag ? `<span class="flag-inline">${opsEsc(t.flag)}</span>` : '';
      const initials = mtInitials(t.display_name || t.username);
      const avInner = t.avatar_url
        ? `<img src="${opsEsc(t.avatar_url)}" alt="">${t.flag ? `<span class="flag">${opsEsc(t.flag)}</span>` : ''}`
        : `${initials}${t.flag ? `<span class="flag">${opsEsc(t.flag)}</span>` : ''}`;

      const storeCount = t.store_count || (t.stores ? t.stores.length : 0);
      const storeLbl = storeCount === 1 ? '1 store' : `${storeCount} stores`;
      const orderTotal = t.order_count_total || 0;
      const orderActive = t.order_count_active || 0;

      const unreadPill = (t.unread_messages || 0) > 0
        ? `<span class="mt-unread-pill"><span class="dot"></span>${t.unread_messages} unread</span>`
        : '';

      const lastLine = t.last_message_preview
        ? `<div class="mt-last">
             <span class="quote">"${opsEsc(t.last_message_preview)}"</span>
             <span class="when">${opsEsc(mtTimeAgo(t.last_message_iso))}</span>
           </div>`
        : '<div class="mt-last"><span class="quote" style="color:#94a3b8;font-style:normal;">No messages yet</span></div>';

      const assignedSince = t.assigned_at_iso
        ? `Assigned since ${opsEsc(mtAssignedSince(t.assigned_at_iso))}`
        : '';

      return `
        <div class="mt-row${(t.unread_messages||0) > 0 ? ' unread' : ''}" data-tenant-id="${opsEsc(t.tenant_id)}">
          <div class="mt-av">${avInner}</div>
          <div class="mt-body">
            <div class="mt-headline">
              <span class="mt-name">${opsEsc(t.display_name || t.username)}${flag}</span>
              ${unreadPill}
            </div>
            <div class="mt-email">${opsEsc(t.email || '—')}</div>
            <div class="mt-meta">
              <span><span class="v">${storeLbl}</span></span>
              <span class="sep">·</span>
              <span><span class="v">${orderTotal}</span> orders</span>
              <span class="sep">·</span>
              <span><span class="v">${orderActive}</span> active</span>
              <span class="sep">·</span>
              <span class="wallet">Wallet ${opsUSD(t.wallet_balance_usd)}</span>
            </div>
            ${lastLine}
            ${assignedSince ? `<div class="mt-assigned">${assignedSince}</div>` : ''}
          </div>
          <div class="mt-actions">
            <button class="ops-btn gold sm" data-action="open-chat" data-tenant-id="${opsEsc(t.tenant_id)}">💬 Open chat</button>
          </div>
        </div>`;
    }

    function mtRenderSkeleton(n){
      const out = [];
      for (let i = 0; i < n; i++){
        out.push(`
          <div class="mt-skel">
            <div class="blk av"></div>
            <div>
              <div class="blk bar1"></div>
              <div class="blk bar2"></div>
              <div class="blk bar3"></div>
            </div>
            <div class="blk btn"></div>
          </div>`);
      }
      return out.join('');
    }

    function mtRenderError(message){
      return `
        <div class="mt-empty">
          <div class="ic">⚠️</div>
          <h3>Could not load your tenants</h3>
          <p>${opsEsc(message || 'Something went wrong. Try again in a moment.')}</p>
          <div style="margin-top:14px;">
            <button class="ops-btn primary" onclick="window.opsLoadMyTenants()">↻ Retry</button>
          </div>
        </div>`;
    }

    function mtRenderEmpty(){
      return `
        <div class="mt-empty">
          <div class="ic">✦</div>
          <h3>No tenants assigned yet</h3>
          <p>New tenants assigned to you will appear here automatically.</p>
        </div>`;
    }

    function mtRender(){
      const root = document.getElementById('opsMyTenantsRoot');
      if (!root) return;
      if (!MT.data){
        root.innerHTML = mtRenderHeader() + `<div class="mt-list">${mtRenderSkeleton(4)}</div>`;
        return;
      }

      const tenants = mtApplySort(mtApplyFilter(MT.data.tenants || []));
      let listHTML;
      if (!(MT.data.tenants || []).length){
        listHTML = mtRenderEmpty();
      } else if (!tenants.length){
        listHTML = `
          <div class="mt-empty">
            <div class="ic">🔎</div>
            <h3>No matches</h3>
            <p>No tenants match "${opsEsc(MT.filter)}".</p>
          </div>`;
      } else {
        listHTML = `<div class="mt-list">${tenants.map(mtRenderRow).join('')}</div>`;
      }

      root.innerHTML = mtRenderHeader() + listHTML;
      mtBindEvents();
    }

    function mtBindEvents(){
      const search = document.getElementById('opsMyTenantsSearch');
      if (search){
        search.addEventListener('input', () => {
          MT.filter = search.value || '';
          mtRenderListOnly();
        });
      }
      const sortSel = document.getElementById('opsMyTenantsSort');
      if (sortSel){
        sortSel.addEventListener('change', () => {
          MT.sort = sortSel.value;
          mtRenderListOnly();
        });
      }
      mtBindRowEvents();
    }

    function mtBindRowEvents(){
      const root = document.getElementById('opsMyTenantsRoot');
      if (!root) return;
      root.querySelectorAll('[data-action="open-chat"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const tid = btn.getAttribute('data-tenant-id');
          mtOpenChat(tid);
        });
      });
      root.querySelectorAll('.mt-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('button')) return;
          const tid = row.getAttribute('data-tenant-id');
          mtOpenChat(tid);
        });
      });
    }

    // Re-render only the list portion to keep search-input focus.
    function mtRenderListOnly(){
      const root = document.getElementById('opsMyTenantsRoot');
      if (!root || !MT.data) return;
      const tenants = mtApplySort(mtApplyFilter(MT.data.tenants || []));
      let listHTML;
      if (!(MT.data.tenants || []).length){
        listHTML = mtRenderEmpty();
      } else if (!tenants.length){
        listHTML = `
          <div class="mt-empty">
            <div class="ic">🔎</div>
            <h3>No matches</h3>
            <p>No tenants match "${opsEsc(MT.filter)}".</p>
          </div>`;
      } else {
        listHTML = `<div class="mt-list">${tenants.map(mtRenderRow).join('')}</div>`;
      }
      const header = root.querySelector('.mt-header');
      while (header && header.nextSibling) root.removeChild(header.nextSibling);
      if (header) header.insertAdjacentHTML('afterend', listHTML);
      mtBindRowEvents();
    }

    function mtOpenChat(tenantId){
      // Hand off to the chat section; record the requested tenant so the
      // chat section can focus it if it implements that hook.
      window.OPS_CHAT_FOCUS_TENANT_ID = tenantId ? Number(tenantId) : null;
      if (typeof window.opsSwitchView === 'function'){
        window.opsSwitchView('chat');
      }
    }

    /* ───── Sidebar badge ───── */
    function mtUpdateRailBadge(){
      const el = document.getElementById('opsMyTenantsCt');
      if (!el) return;
      const total = (MT.data && MT.data.tenants ? MT.data.tenants : [])
        .reduce((s,t) => s + (t.unread_messages || 0), 0);
      if (total > 0){
        el.textContent = total;
        el.style.display = 'inline-flex';
        el.classList.remove('amber');
      } else {
        el.style.display = 'none';
      }
    }

    /* ───── Loader (exposed globally) ───── */
    window.opsLoadMyTenants = async function(){
      const root = document.getElementById('opsMyTenantsRoot');
      if (!root) return;

      // Show skeleton on first open; on refresh keep current view until response.
      if (!MT.booted){
        root.innerHTML = `
          <div class="mt-header">
            <div class="mt-header-inner">
              <div class="mt-htitle">Your dedicated tenant roster</div>
              <div class="mt-hsub">Loading…</div>
            </div>
          </div>
          <div class="mt-list">${mtRenderSkeleton(4)}</div>`;
      }

      let resp;
      try {
        resp = await opsFetch('/ops/api/my-tenants/');
      } catch (e) {
        root.innerHTML = mtRenderError('Network error: ' + (e && e.message ? e.message : 'unable to reach server.'));
        return;
      }

      if (!resp.ok){
        const msg = (resp.data && resp.data.error)
          || (resp.status === 404 ? 'The My-Tenants endpoint is not yet available — try again once the backend ships.' : 'Failed to load tenants.');
        root.innerHTML = mtRenderError(msg);
        return;
      }

      MT.data = resp.data || {};
      MT.booted = true;
      mtRender();
      mtUpdateRailBadge();
    };

    /* ───── Prime sidebar badge silently on first dashboard boot ───── */
    function mtPrimeBadge(){
      if (MT.booted) return;
      opsFetch('/ops/api/my-tenants/').then(r => {
        if (r.ok){
          MT.data = r.data || {};
          mtUpdateRailBadge();
        }
      }).catch(()=>{});
    }
    if (document.readyState === 'complete' || document.readyState === 'interactive'){
      setTimeout(mtPrimeBadge, 800);
    } else {
      window.addEventListener('DOMContentLoaded', () => setTimeout(mtPrimeBadge, 800));
    }
  })();
</script>

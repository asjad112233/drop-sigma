<!-- ════════════════════════════════════════════════════════════════════════
     Master Product Catalog section
     ──────────────────────────────────────────────────────────────────────
     A unified view of EVERY product across EVERY tenant store.
       · KPI dashboard (totals · sourced coverage · cross-tenant duplicates)
       · Sticky filter toolbar (search + store + tenant + platform + sourced
         + cross-tenant + sort)
       · Polished product rows grouped by SKU, showing the cross-tenant
         picture (all listings, all suppliers, margin opportunity)
       · SKU detail modal (variants · sourcing comparison · recent orders)
       · Pagination ("Load more")
     ──────────────────────────────────────────────────────────────────── -->
<div id="opsMasterCatalogRoot">
  <div class="ops-loading" style="padding:60px 0;text-align:center;color:#94a3b8;font-weight:700;">
    Loading master catalog…
  </div>
</div>

<style>
  /* ════ Section-scoped tokens / base ══════════════════════════════ */
  #opsMasterCatalogRoot{font-size:13px;--mc-shadow:0 1px 0 rgba(15,23,42,.02),0 18px 38px -26px rgba(15,23,42,.22);}
  #opsMasterCatalogRoot *{box-sizing:border-box;}
  #opsMasterCatalogRoot .mc-num{font-variant-numeric:tabular-nums;}

  /* ════ Section header ════════════════════════════════════════════ */
  #opsMasterCatalogRoot .mc-hdr{
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    margin-bottom:16px;flex-wrap:wrap;
  }
  #opsMasterCatalogRoot .mc-hdr-l{min-width:0;flex:1;}
  #opsMasterCatalogRoot .mc-hdr-title{
    font-size:22px;font-weight:900;color:#0f172a;letter-spacing:-.02em;
    display:flex;align-items:center;gap:10px;
  }
  #opsMasterCatalogRoot .mc-hdr-sub{
    margin-top:4px;font-size:12px;font-weight:600;color:#64748b;
  }
  #opsMasterCatalogRoot .mc-hdr-r{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;
  }
  #opsMasterCatalogRoot .mc-synced{
    font-size:11px;font-weight:700;color:#64748b;
    background:#fff;border:1px solid var(--ops-border);border-radius:999px;
    padding:6px 12px;display:inline-flex;align-items:center;gap:6px;
  }
  #opsMasterCatalogRoot .mc-synced .dot{
    width:8px;height:8px;border-radius:50%;background:#10b981;
    box-shadow:0 0 0 3px rgba(16,185,129,.18);
  }
  #opsMasterCatalogRoot .mc-synced.warn .dot{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.18);}
  #opsMasterCatalogRoot .mc-synced.err  .dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.18);}

  /* ════ KPI grid ══════════════════════════════════════════════════ */
  #opsMasterCatalogRoot .mc-kpi-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;margin-bottom:16px;
  }
  #opsMasterCatalogRoot .mc-kpi{
    background:#fff;border:1px solid var(--ops-border);border-radius:16px;
    padding:16px 18px;box-shadow:var(--mc-shadow);position:relative;overflow:hidden;
  }
  #opsMasterCatalogRoot .mc-kpi::before{
    content:"";position:absolute;left:0;top:14px;width:4px;height:14px;border-radius:0 4px 4px 0;
    background:linear-gradient(180deg,#d4af37,#a855f7);
  }
  #opsMasterCatalogRoot .mc-kpi-lbl{
    font-size:10.5px;font-weight:900;color:#64748b;text-transform:uppercase;
    letter-spacing:.08em;display:flex;align-items:center;gap:6px;padding-left:8px;
  }
  #opsMasterCatalogRoot .mc-kpi-val{
    margin-top:8px;font-size:24px;font-weight:900;color:#0f172a;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#0f172a 0%,#5b21b6 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  #opsMasterCatalogRoot .mc-kpi-sub{
    margin-top:4px;font-size:11.5px;font-weight:700;color:#64748b;
    font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-progress{
    margin-top:10px;height:6px;background:#f1f5f9;border-radius:999px;overflow:hidden;
  }
  #opsMasterCatalogRoot .mc-progress > div{
    height:100%;background:linear-gradient(90deg,#d4af37 0%,#f4c430 50%,#a855f7 100%);
    border-radius:999px;transition:width .4s ease;
  }

  /* ════ Filter toolbar ════════════════════════════════════════════ */
  #opsMasterCatalogRoot .mc-toolbar{
    background:#fff;border:1px solid var(--ops-border);border-radius:14px;
    padding:14px 16px;margin-bottom:14px;
    box-shadow:0 1px 0 rgba(15,23,42,.02),0 10px 28px -22px rgba(15,23,42,.16);
    position:sticky;top:74px;z-index:6;
  }
  #opsMasterCatalogRoot .mc-search{
    display:flex;align-items:center;gap:8px;
    background:#f8fafc;border:1.5px solid #e5e7eb;border-radius:11px;
    padding:10px 14px;transition:border-color .15s,box-shadow .15s,background .15s;
  }
  #opsMasterCatalogRoot .mc-search:focus-within{
    border-color:#a855f7;background:#fff;
    box-shadow:0 0 0 3px rgba(168,85,247,.12);
  }
  #opsMasterCatalogRoot .mc-search .ic{color:#94a3b8;font-size:14px;}
  #opsMasterCatalogRoot .mc-search input{
    border:none;background:transparent;outline:none;flex:1;font-size:13.5px;
    font-weight:600;color:#0f172a;
  }
  #opsMasterCatalogRoot .mc-search input::placeholder{color:#94a3b8;font-weight:600;}
  #opsMasterCatalogRoot .mc-search .clear{
    background:none;border:none;color:#94a3b8;cursor:pointer;
    font-size:18px;line-height:1;padding:0 4px;display:none;
  }
  #opsMasterCatalogRoot .mc-search .clear.show{display:inline;}
  #opsMasterCatalogRoot .mc-filters{
    margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  }
  #opsMasterCatalogRoot .mc-select{
    background:#fff;border:1px solid #e5e7eb;border-radius:10px;
    padding:7px 28px 7px 12px;font-size:12px;font-weight:700;color:#334155;
    cursor:pointer;outline:none;min-width:140px;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%2364748b' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat:no-repeat;background-position:right 10px center;
  }
  #opsMasterCatalogRoot .mc-select:focus,
  #opsMasterCatalogRoot .mc-select:hover{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.12);}
  #opsMasterCatalogRoot .mc-count-chip{
    margin-left:auto;font-size:11.5px;font-weight:800;color:#fff;
    background:linear-gradient(135deg,#0f172a 0%,#1f2937 100%);
    border-radius:999px;padding:6px 12px;
    box-shadow:0 6px 14px -8px rgba(15,23,42,.5);
    font-variant-numeric:tabular-nums;letter-spacing:.005em;
  }
  #opsMasterCatalogRoot .mc-count-chip .num{color:#f4c430;}
  #opsMasterCatalogRoot .mc-clear-btn{
    background:#fff;border:1px solid #e5e7eb;color:#64748b;
    padding:7px 12px;border-radius:10px;font-size:11.5px;font-weight:800;
    cursor:pointer;transition:all .12s;
  }
  #opsMasterCatalogRoot .mc-clear-btn:hover{background:#f1f5f9;color:#0f172a;}

  /* ════ Product list — compact queue-style rows ═══════════════════ */
  #opsMasterCatalogRoot .mc-list{display:flex;flex-direction:column;gap:10px;}

  /* Card wrapper — same shell as queue row */
  #opsMasterCatalogRoot .mc-row{
    background:#fff;border:1px solid rgba(15,23,42,.18);border-radius:14px;
    overflow:hidden;cursor:pointer;
    box-shadow:inset 0 0 0 1px rgba(212,175,55,.08),
               0 1px 0 rgba(15,23,42,.02),
               0 10px 24px -22px rgba(15,23,42,.18);
    transition:border-color .15s, box-shadow .15s;
  }
  #opsMasterCatalogRoot .mc-row:hover{
    border-color:rgba(168,85,247,.28);
    box-shadow:inset 0 0 0 1px rgba(212,175,55,.1),
               0 14px 32px -22px rgba(15,23,42,.25);
  }
  #opsMasterCatalogRoot .mc-row.is-opportunity{
    border-color:rgba(245,158,11,.45);
    box-shadow:inset 0 0 0 1px rgba(245,158,11,.18),
               0 14px 32px -22px rgba(245,158,11,.35);
  }

  /* Top strip — thin slate bar with key metadata */
  #opsMasterCatalogRoot .mc-strip{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 14px;
    background:linear-gradient(180deg,#f5f7fc 0%,#eaeef7 100%);
    border-bottom:1px solid rgba(15,23,42,.12);
    font-size:11.5px;font-weight:700;color:#475569;
  }
  #opsMasterCatalogRoot .mc-strip .sku{
    font-family:"SF Mono",ui-monospace,Menlo,monospace;
    font-size:11px;font-weight:800;color:#3f2305;
    background:linear-gradient(135deg,rgba(212,175,55,.15),rgba(244,196,48,.1));
    border:1px solid rgba(212,175,55,.3);border-radius:6px;
    padding:3px 9px;letter-spacing:.02em;
  }
  #opsMasterCatalogRoot .mc-strip .sep{color:#cbd5e1;}
  #opsMasterCatalogRoot .mc-strip .meta{color:#64748b;font-weight:700;}
  #opsMasterCatalogRoot .mc-strip-right{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}

  /* Status pills on the strip */
  #opsMasterCatalogRoot .mc-pill{
    font-size:9.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;
    border-radius:6px;padding:3px 8px;border:1px solid transparent;
    display:inline-flex;align-items:center;gap:4px;
    font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-pill.tenant{
    background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(168,85,247,.12));
    color:#5b21b6;border-color:rgba(168,85,247,.3);
  }
  #opsMasterCatalogRoot .mc-pill.variant{
    background:rgba(15,23,42,.06);color:#334155;border-color:rgba(15,23,42,.1);
  }
  #opsMasterCatalogRoot .mc-pill.opportunity{
    background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#7c2d12;
    border-color:#f59e0b;
  }
  #opsMasterCatalogRoot .mc-pill.unsourced{
    background:#fef3c7;color:#92400e;border-color:#fde68a;
  }
  #opsMasterCatalogRoot .mc-pill.sourced{
    background:#dcfce7;color:#166534;border-color:#bbf7d0;
  }
  #opsMasterCatalogRoot .mc-pill.multi{
    background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(5,150,105,.15));
    color:#047857;border-color:rgba(16,185,129,.35);
  }

  /* BODY — single horizontal grid with column dividers (like queue) */
  #opsMasterCatalogRoot .mc-body{
    display:grid;
    grid-template-columns:48px minmax(180px, 1.4fr) minmax(150px, 1.2fr) minmax(170px, 1.3fr) minmax(130px, 1fr) auto;
    gap:0;align-items:center;
    padding:12px 14px;
  }
  /* Vertical column dividers */
  #opsMasterCatalogRoot .mc-body > * + *{
    padding-left:12px;
    border-left:1px solid rgba(15,23,42,.1);
    margin-left:0;
    align-self:stretch;
    display:flex;flex-direction:column;justify-content:center;
  }
  #opsMasterCatalogRoot .mc-body > .mc-cell-actions{
    flex-direction:row;align-items:center;gap:6px;
  }

  /* Image cell (first column) */
  #opsMasterCatalogRoot .mc-img{
    width:48px;height:48px;border-radius:10px;overflow:hidden;
    background:linear-gradient(135deg,#fafaf7,#f1f5f9);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#94a3b8;border:1px solid rgba(15,23,42,.06);
    cursor:zoom-in;flex-shrink:0;
  }
  #opsMasterCatalogRoot .mc-img img{width:100%;height:100%;object-fit:cover;display:block;}

  /* Product name cell */
  #opsMasterCatalogRoot .mc-cell-name{padding-left:12px;min-width:0;}
  #opsMasterCatalogRoot .mc-cell-name .nm{
    font-size:13px;font-weight:800;color:#0f172a;letter-spacing:-.005em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #opsMasterCatalogRoot .mc-cell-name .mt{
    font-size:11px;color:#64748b;font-weight:600;margin-top:3px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  #opsMasterCatalogRoot .mc-cell-name .cat{
    font-size:9.5px;font-weight:900;color:#5b21b6;
    background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.22);
    border-radius:5px;padding:1px 6px;
    text-transform:uppercase;letter-spacing:.04em;
  }

  /* Sold-by compact cell */
  #opsMasterCatalogRoot .mc-cell-sold .lbl{
    font-size:9px;font-weight:900;color:#94a3b8;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;
  }
  #opsMasterCatalogRoot .mc-cell-sold .stores{
    display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:#0f172a;
    margin-bottom:3px;
  }
  /* Platform brand badges — matches the queue's .oq-plat-badge exactly */
  #opsMasterCatalogRoot .mc-cell-sold .stores .plat{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:5px;
    font-size:11px;font-weight:900;line-height:1;flex-shrink:0;cursor:default;
    font-family:"SF Pro Display","Inter",ui-sans-serif,system-ui,sans-serif;
  }
  #opsMasterCatalogRoot .mc-cell-sold .stores .plat.shopify{
    background:linear-gradient(135deg,#95bf47,#5e8e3e);
    box-shadow:0 1px 0 rgba(94,142,62,.18),inset 0 1px 0 rgba(255,255,255,.18);
  }
  #opsMasterCatalogRoot .mc-cell-sold .stores .plat.woocommerce,
  #opsMasterCatalogRoot .mc-cell-sold .stores .plat.woo{
    background:linear-gradient(135deg,#9b6dc4,#7f54b3);color:#fff;
    box-shadow:0 1px 0 rgba(127,84,179,.2),inset 0 1px 0 rgba(255,255,255,.18);
  }
  #opsMasterCatalogRoot .mc-cell-sold .stores .plat.other{
    background:#f1f5f9;color:#475569;border:1px solid #e5e7eb;
  }
  #opsMasterCatalogRoot .mc-cell-sold .price{
    font-size:12px;font-weight:900;color:#0f172a;font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-cell-sold .sub{
    font-size:10.5px;color:#64748b;font-weight:700;margin-top:1px;
  }
  #opsMasterCatalogRoot .mc-cell-sold .empty{
    font-size:11px;font-weight:700;color:#94a3b8;font-style:italic;
  }

  /* Sourced-via compact cell */
  #opsMasterCatalogRoot .mc-cell-sup .lbl{
    font-size:9px;font-weight:900;color:#94a3b8;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;
  }
  #opsMasterCatalogRoot .mc-cell-sup .nm{
    font-size:12px;font-weight:800;color:#0f172a;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    display:flex;align-items:center;gap:4px;
  }
  #opsMasterCatalogRoot .mc-cell-sup .nm .star{color:#f4c430;font-size:11px;}
  #opsMasterCatalogRoot .mc-cell-sup .meta{
    font-size:10.5px;color:#475569;font-weight:700;margin-top:2px;
    font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-cell-sup .meta .cost{color:#047857;font-weight:900;}
  #opsMasterCatalogRoot .mc-cell-sup .warn{
    font-size:10px;font-weight:800;color:#92400e;margin-top:2px;
  }
  #opsMasterCatalogRoot .mc-cell-sup .empty{
    font-size:11px;font-weight:800;color:#92400e;
    background:linear-gradient(135deg,#fef3c7,#fde68a);
    border:1px dashed #f59e0b;border-radius:7px;padding:5px 9px;
    display:inline-flex;align-items:center;gap:4px;
  }

  /* Margin compact cell */
  #opsMasterCatalogRoot .mc-cell-margin .lbl{
    font-size:9px;font-weight:900;color:#94a3b8;
    text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;
  }
  #opsMasterCatalogRoot .mc-cell-margin .retail{
    font-size:12.5px;font-weight:900;color:#0f172a;font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-cell-margin .cost-line{
    font-size:10.5px;color:#64748b;font-weight:700;margin-top:1px;
    font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-cell-margin .gain{
    color:#047857;font-weight:900;font-size:11px;margin-top:2px;
    font-variant-numeric:tabular-nums;
  }

  /* Actions cell */
  #opsMasterCatalogRoot .mc-cell-actions{padding-left:12px;}
  #opsMasterCatalogRoot .mc-cell-actions .ops-btn{
    padding:7px 11px;font-size:11px;
  }

  /* ════ Pagination — page-numbered, professional ═════════════════ */
  #opsMasterCatalogRoot .mc-paginate{
    display:flex;align-items:center;justify-content:flex-end;gap:14px;
    margin-top:18px;padding:11px 18px;background:#fff;border:1px solid var(--ops-border);
    border-radius:14px;flex-wrap:wrap;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 26px -22px rgba(15,23,42,.16);
    font-variant-numeric:tabular-nums;
  }
  #opsMasterCatalogRoot .mc-pag-pages{display:flex;align-items:center;gap:4px;}
  #opsMasterCatalogRoot .mc-pag-btn{
    min-width:32px;height:32px;padding:0 8px;border-radius:8px;
    border:1px solid transparent;background:transparent;
    font-size:13px;font-weight:700;color:#475569;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:inherit;font-variant-numeric:tabular-nums;
    transition:background .12s, color .12s, border-color .12s;
  }
  #opsMasterCatalogRoot .mc-pag-btn:hover:not(:disabled):not(.active){
    background:#f1f5f9;color:#0f172a;
  }
  #opsMasterCatalogRoot .mc-pag-btn:disabled{
    color:#cbd5e1;cursor:not-allowed;
  }
  #opsMasterCatalogRoot .mc-pag-btn.active{
    background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;
    box-shadow:0 4px 12px -4px rgba(168,85,247,.5);
    font-weight:900;
  }
  #opsMasterCatalogRoot .mc-pag-btn.nav{
    color:#64748b;font-size:14px;
  }
  #opsMasterCatalogRoot .mc-pag-ellipsis{
    min-width:24px;text-align:center;color:#94a3b8;font-weight:700;font-size:13px;
  }
  #opsMasterCatalogRoot .mc-pag-jump{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12px;font-weight:700;color:#64748b;
  }
  #opsMasterCatalogRoot .mc-pag-jump input{
    width:50px;height:30px;padding:0 8px;border-radius:7px;
    border:1px solid #e2e8f0;background:#fff;
    font-size:12.5px;font-weight:700;color:#0f172a;
    font-family:inherit;font-variant-numeric:tabular-nums;
    text-align:center;outline:none;
  }
  #opsMasterCatalogRoot .mc-pag-jump input:focus{
    border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.12);
  }
  #opsMasterCatalogRoot .mc-pag-jump button{
    height:30px;padding:0 12px;border-radius:7px;
    border:1px solid #e2e8f0;background:#fff;
    font-size:11.5px;font-weight:800;color:#475569;cursor:pointer;

  #opsMasterCatalogRoot .mc-pag-jump button:hover{
    border-color:#a855f7;color:#a855f7;background:#faf7ff;
  }
  #opsMasterCatalogRoot .mc-pag-jump button:disabled{
    opacity:.5;cursor:not-allowed;
  }
  #opsMasterCatalogRoot .mc-pag-total{
    font-size:12px;font-weight:700;color:#64748b;
  }
  #opsMasterCatalogRoot .mc-pag-total b{color:#0f172a;font-weight:900;}
  #opsMasterCatalogRoot .mc-pag-pp{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;color:#64748b;font-weight:700;
  }
  #opsMasterCatalogRoot .mc-pag-pp select{
    height:30px;padding:0 8px;border-radius:7px;
    border:1px solid #e2e8f0;background:#fff;
    font-size:12.5px;font-weight:700;color:#0f172a;cursor:pointer;
    font-family:inherit;outline:none;
  }
  #opsMasterCatalogRoot .mc-pag-pp select:focus{
    border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.12);
  }

  /* ════ Empty / loading states ════════════════════════════════════ */
  #opsMasterCatalogRoot .mc-empty{
    padding:60px 24px;text-align:center;background:#fff;border:1px dashed #e5e7eb;
    border-radius:16px;color:#64748b;
  }
  #opsMasterCatalogRoot .mc-empty .ic{font-size:48px;display:block;margin-bottom:10px;}
  #opsMasterCatalogRoot .mc-empty h4{font-size:15px;color:#0f172a;font-weight:900;margin:0 0 6px;}
  #opsMasterCatalogRoot .mc-empty p{font-size:12.5px;font-weight:600;margin:0 0 12px;color:#64748b;}

  #opsMasterCatalogRoot .mc-skeleton{
    height:148px;background:#fff;border:1px solid var(--ops-border);border-radius:16px;
    position:relative;overflow:hidden;
  }
  #opsMasterCatalogRoot .mc-skeleton::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 0,rgba(15,23,42,.04) 40%,rgba(15,23,42,.07) 50%,rgba(15,23,42,.04) 60%,transparent 100%);
    animation:mcShimmer 1.4s infinite;
  }
  @keyframes mcShimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}

  #opsMasterCatalogRoot .mc-list-loading{display:flex;flex-direction:column;gap:12px;}

  /* ════ SKU detail modal ══════════════════════════════════════════ */
  #opsMcModal{
    position:fixed;inset:0;z-index:9400;display:none;
    align-items:center;justify-content:center;padding:24px;
  }

<script>
(function(){
  'use strict';

  /* ════ Local state ═══════════════════════════════════════════════ */
  const STATE = {
    loaded: false,
    loadingList: false,
    loadingStats: false,
    stats: null,
    filters: null,
    products: [],
    total: 0,
    offset: 0,
    limit: 50,
    syncing: false,
    params: {
      search: '',
      store: '',
      tenant: '',
      platform: '',
      sourced: '',
      cross_tenant: '',
      sort: 'cross_tenant',
    },
  };
  let SEARCH_TIMER = null;

  /* ════ Helpers ════════════════════════════════════════════════════ */
  function esc(s){ return (typeof opsEsc === 'function') ? opsEsc(s) : String(s==null?'':s); }
  function usd(n){ return (typeof opsUSD === 'function') ? opsUSD(n) : ('$' + Number(n||0).toFixed(2)); }
  function toast(msg, kind){ if (typeof opsToast === 'function') opsToast(msg, kind); }
  function num(n){ return Number(n||0).toLocaleString('en-US'); }
  function pct(n){ return (Number(n||0)).toFixed(1).replace(/\.0$/,'') + '%'; }
  function timeAgo(ts){
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d)) return '';
    const sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 5) return 'just now';
    if (sec < 60) return sec + 's ago';
    if (sec < 3600) return Math.floor(sec/60) + ' min ago';
    if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
    return Math.floor(sec/86400) + 'd ago';
  }
  function platformClass(key){
    const k = String(key||'').toLowerCase();
    if (k.indexOf('shopify') >= 0) return 'shopify';
    if (k.indexOf('woo') >= 0) return 'woo';
    return 'other';
  }
  function platformLabel(p){
    if (!p) return '—';
    const k = String(p).toLowerCase();
    if (k.indexOf('shopify') >= 0) return 'Shopify';
    if (k.indexOf('woo') >= 0) return 'WooCommerce';
    return p;
  }

  /* ════ Shell ════════════════════════════════════════════════════ */
  function buildShell(){
    const root = document.getElementById('opsMasterCatalogRoot');
    if (!root) return;
    root.innerHTML = ''
      + '<div class="mc-hdr">'
      +   '<div class="mc-hdr-l">'
      +     '<div class="mc-hdr-title">🌐 Master Product Catalog</div>'
      +     '<div class="mc-hdr-sub">Every product across every tenant store · searchable, filterable, sourced or unsourced</div>'
      +   '</div>'
      +   '<div class="mc-hdr-r">'
      +     '<div class="mc-synced" id="mcSyncedChip" title="Last catalog sync"><span class="dot"></span><span id="mcSyncedText">Loading…</span></div>'
      +     '<button class="ops-btn primary" id="mcSyncBtn">🔄 Sync now</button>'
      +   '</div>'
      + '</div>'
      + '<div class="mc-kpi-grid" id="mcKpiGrid">'
      +   '<div class="mc-skeleton" style="height:96px;"></div>'
      +   '<div class="mc-skeleton" style="height:96px;"></div>'
      +   '<div class="mc-skeleton" style="height:96px;"></div>'
      +   '<div class="mc-skeleton" style="height:96px;"></div>'
      + '</div>'
      + '<div class="mc-toolbar" id="mcToolbar">'
      +   '<div class="mc-search">'
      +     '<span class="ic">🔎</span>'
      +     '<input id="mcSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search by SKU, product name, brand…">'
      +     '<button class="clear" id="mcSearchClear" title="Clear search">✕</button>'
      +   '</div>'
      +   '<div class="mc-filters">'
      +     '<select class="mc-select" id="mcFiltStore"><option value="">All stores</option></select>'
      +     '<select class="mc-select" id="mcFiltTenant"><option value="">All tenants</option></select>'
      +     '<select class="mc-select" id="mcFiltPlatform">'
      +       '<option value="">All platforms</option>'
      +       '<option value="shopify">Shopify</option>'
      +       '<option value="woocommerce">WooCommerce</option>'
      +     '</select>'
      +     '<select class="mc-select" id="mcFiltSourced">'
      +       '<option value="">All sourcing</option>'
      +       '<option value="sourced">Sourced</option>'
      +       '<option value="unsourced">Not sourced</option>'
      +       '<option value="single">Single source</option>'
      +       '<option value="multi">Multi-source</option>'
      +     '</select>'
      +     '<select class="mc-select" id="mcFiltCross">'
      +       '<option value="">All</option>'
      +       '<option value="1">Sold by 2+ tenants</option>'
      +     '</select>'
      +     '<select class="mc-select" id="mcFiltSort">'
      +       '<option value="cross_tenant">Cross-tenant duplicates</option>'
      +       '<option value="listings">Most listings</option>'
      +       '<option value="newest">Newest</option>'
      +       '<option value="price_asc">Price ↑</option>'
      +       '<option value="price_desc">Price ↓</option>'
      +       '<option value="name">Name A–Z</option>'
      +     '</select>'
      +     '<button class="mc-clear-btn" id="mcClearFilters" title="Reset all filters">Reset</button>'
      +     '<span class="mc-count-chip" id="mcCountChip"><span class="num">0</span> products</span>'
      +   '</div>'
      + '</div>'
      + '<div id="mcListWrap">'
      +   '<div class="mc-list-loading">'
      +     '<div class="mc-skeleton"></div><div class="mc-skeleton"></div><div class="mc-skeleton"></div>'
      +   '</div>'
      + '</div>'
      + '<div id="mcPaginate"></div>'
      + '<div id="opsMcModal" role="dialog" aria-modal="true">'
      +   '<div class="mcm-back" id="mcmBack"></div>'
      +   '<div class="mcm-panel" id="mcmPanel">'
      +     '<div class="mcm-head" id="mcmHead">'
      +       '<div class="mcm-img" id="mcmHeadImg">📦</div>'
      +       '<div class="body"><div class="tl" id="mcmTitle">—</div><div class="sb" id="mcmSubtitle"></div></div>'
      +       '<button class="x" id="mcmClose">✕</button>'
      +     '</div>'
      +     '<div class="mcm-body" id="mcmBody"><div class="ops-loading" style="text-align:center;padding:40px 0;color:#94a3b8;font-weight:700;">Loading SKU detail…</div></div>'
      +     '<div class="mcm-foot" id="mcmFoot">'
      +       '<button class="ops-btn ghost" id="mcmCloseBtn">Close</button>'
      +       '<span class="sep"></span>'
      +       '<button class="ops-btn" id="mcmFindSupplier">💬 Find supplier</button>'
      +       '<button class="ops-btn primary" id="mcmSendQuote">📤 Send for quote</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';

    document.getElementById('mcSyncBtn').addEventListener('click', onSyncClick);
    const si = document.getElementById('mcSearchInput');
    si.addEventListener('input', onSearchInput);
    document.getElementById('mcSearchClear').addEventListener('click', function(){
      si.value = ''; STATE.params.search = '';
      document.getElementById('mcSearchClear').classList.remove('show');
      reloadList();
    });
    ['mcFiltStore','mcFiltTenant','mcFiltPlatform','mcFiltSourced','mcFiltCross','mcFiltSort'].forEach(function(id){
      document.getElementById(id).addEventListener('change', onFilterChange);
    });
    document.getElementById('mcClearFilters').addEventListener('click', resetFilters);
    document.getElementById('mcmClose').addEventListener('click', closeDetailModal);
    document.getElementById('mcmCloseBtn').addEventListener('click', closeDetailModal);
    document.getElementById('mcmBack').addEventListener('click', closeDetailModal);
    document.addEventListener('keydown', function(e){
      if (e.key === 'Escape' && document.getElementById('opsMcModal').classList.contains('is-open')){
        closeDetailModal();
      }
    });
  }

  /* ════ Filter handlers ══════════════════════════════════════════ */
  function onSearchInput(e){
    const v = (e.target.value || '').trim();
    document.getElementById('mcSearchClear').classList.toggle('show', !!v);
    if (SEARCH_TIMER) clearTimeout(SEARCH_TIMER);
    SEARCH_TIMER = setTimeout(function(){
      STATE.params.search = v; reloadList();
    }, 350);
  }
  function onFilterChange(){
    STATE.params.store    = document.getElementById('mcFiltStore').value || '';
    STATE.params.tenant   = document.getElementById('mcFiltTenant').value || '';
    STATE.params.platform = document.getElementById('mcFiltPlatform').value || '';
    STATE.params.sourced  = document.getElementById('mcFiltSourced').value || '';
    STATE.params.cross_tenant = document.getElementById('mcFiltCross').value || '';
    STATE.params.sort     = document.getElementById('mcFiltSort').value || 'cross_tenant';
    reloadList();
  }
  function resetFilters(){
    STATE.params = { search:'', store:'', tenant:'', platform:'', sourced:'', cross_tenant:'', sort:'cross_tenant' };
    const si = document.getElementById('mcSearchInput'); if (si) si.value = '';
    const sc = document.getElementById('mcSearchClear'); if (sc) sc.classList.remove('show');
    ['mcFiltStore','mcFiltTenant','mcFiltPlatform','mcFiltSourced','mcFiltCross'].forEach(function(id){
      const el = document.getElementById(id); if (el) el.value = '';
    });
    const ss = document.getElementById('mcFiltSort'); if (ss) ss.value = 'cross_tenant';
    reloadList();
  }

  /* ════ Stats ═════════════════════════════════════════════════════ */
  function renderStats(){
    const grid = document.getElementById('mcKpiGrid');
    if (!grid) return;
    const s = STATE.stats || {};
    const total    = Number(s.total_products || 0);
    const uniq     = Number(s.unique_skus || 0);
    const sourced  = Number(s.sourced_skus || 0);
    const coverage = Number(s.coverage_pct || 0);
    const cross    = Number(s.cross_tenant_skus || 0);
    const hvUns    = Number(s.high_volume_unsourced || 0);
    const multi    = Number(s.multi_source_skus || 0);
    grid.innerHTML =
        '<div class="mc-kpi">'
      +   '<div class="mc-kpi-lbl">💎 Total products</div>'
      +   '<div class="mc-kpi-val mc-num">'+num(total)+'</div>'
      +   '<div class="mc-kpi-sub">'+num(s.stores_synced||0)+' stores synced'+(s.stores_failed ? ' · '+num(s.stores_failed)+' failed' : '')+'</div>'
      + '</div>'
      + '<div class="mc-kpi">'
      +   '<div class="mc-kpi-lbl">🔍 Unique SKUs</div>'
      +   '<div class="mc-kpi-val mc-num">'+num(uniq)+'</div>'
      +   '<div class="mc-kpi-sub">'+num(multi)+' multi-source · across all tenants</div>'
      + '</div>'
      + '<div class="mc-kpi">'
      +   '<div class="mc-kpi-lbl">✅ Sourced coverage</div>'
      +   '<div class="mc-kpi-val mc-num">'+num(sourced)+' / '+num(uniq)+'</div>'
      +   '<div class="mc-kpi-sub">'+pct(coverage)+' coverage</div>'
      +   '<div class="mc-progress"><div style="width:'+Math.min(100,Math.max(0,coverage))+'%;"></div></div>'
      + '</div>'
      + '<div class="mc-kpi">'
      +   '<div class="mc-kpi-lbl">🔥 Cross-tenant duplicates</div>'
      +   '<div class="mc-kpi-val mc-num">'+num(cross)+'</div>'
      +   '<div class="mc-kpi-sub">'+num(hvUns)+' high-volume SKUs still unsourced — top opportunities</div>'
      + '</div>';
    const chip = document.getElementById('mcSyncedChip');
    const txt  = document.getElementById('mcSyncedText');
    if (chip && txt){
      const failed = Number(s.stores_failed||0);
      chip.classList.remove('warn','err');
      if (failed > 0 && Number(s.stores_synced||0) === 0) chip.classList.add('err');
      else if (failed > 0) chip.classList.add('warn');
      if (s.last_synced_at){
        const ago = timeAgo(s.last_synced_at);
        txt.textContent = ago ? ('Updated ' + ago) : 'Recently synced';
      } else {
        txt.textContent = 'Never synced';
      }
    }
  }

  function renderStatsFallback(){
    const grid = document.getElementById('mcKpiGrid');
    if (!grid) return;
    grid.innerHTML =
        '<div class="mc-kpi"><div class="mc-kpi-lbl">💎 Total products</div><div class="mc-kpi-val mc-num">—</div><div class="mc-kpi-sub">Stats unavailable</div></div>'
      + '<div class="mc-kpi"><div class="mc-kpi-lbl">🔍 Unique SKUs</div><div class="mc-kpi-val mc-num">—</div><div class="mc-kpi-sub">Stats unavailable</div></div>'
      + '<div class="mc-kpi"><div class="mc-kpi-lbl">✅ Sourced coverage</div><div class="mc-kpi-val mc-num">—</div><div class="mc-kpi-sub">Stats unavailable</div></div>'
      + '<div class="mc-kpi"><div class="mc-kpi-lbl">🔥 Cross-tenant duplicates</div><div class="mc-kpi-val mc-num">—</div><div class="mc-kpi-sub">Stats unavailable</div></div>';
    const txt = document.getElementById('mcSyncedText');
    if (txt) txt.textContent = 'Status unavailable';
    const chip = document.getElementById('mcSyncedChip');
    if (chip){ chip.classList.remove('warn'); chip.classList.add('err'); }
  }

  /* ════ Filters dropdown populate ════════════════════════════════ */
  function renderFilters(){
    const f = STATE.filters || {};
    const stores  = Array.isArray(f.stores) ? f.stores : [];
    const tenants = Array.isArray(f.tenants) ? f.tenants : [];
    const sSel = document.getElementById('mcFiltStore');
    const tSel = document.getElementById('mcFiltTenant');
    if (sSel){
      sSel.innerHTML = '<option value="">All stores</option>' + stores.map(function(s){
        return '<option value="'+esc(s.id)+'">'+esc(s.name)+(s.platform ? ' · '+esc(platformLabel(s.platform)) : '')+'</option>';
      }).join('');
      if (STATE.params.store) sSel.value = STATE.params.store;
    }
    if (tSel){
      tSel.innerHTML = '<option value="">All tenants</option>' + tenants.map(function(t){
        const lbl = t.full_name || t.username || ('#'+t.id);
        const sc  = t.store_count ? ' ('+t.store_count+')' : '';
        return '<option value="'+esc(t.id)+'">'+esc(lbl)+sc+'</option>';
      }).join('');
      if (STATE.params.tenant) tSel.value = STATE.params.tenant;
    }
  }

  /* ════ Product list rendering ═══════════════════════════════════ */
  function renderListLoading(){
    const wrap = document.getElementById('mcListWrap');
    if (!wrap) return;
    wrap.innerHTML = '<div class="mc-list-loading"><div class="mc-skeleton"></div><div class="mc-skeleton"></div><div class="mc-skeleton"></div></div>';
  }

  function renderEmpty(kind){
    const wrap = document.getElementById('mcListWrap');
    if (!wrap) return;
    let html = '';
    if (kind === 'no_data'){
      html = '<div class="mc-empty">'
           + '<span class="ic">🌐</span>'
           + '<h4>Master catalog not yet synced</h4>'
           + '<p>Click <b>Sync now</b> above to fetch every product from every connected tenant store.</p>'
           + '<button class="ops-btn gold" onclick="document.getElementById(\'mcSyncBtn\').click()">🔄 Sync now</button>'
           + '</div>';
    } else if (kind === 'error'){
      html = '<div class="mc-empty">'
           + '<span class="ic">⚠️</span>'
           + '<h4>Could not load catalog</h4>'
           + '<p>'+esc(STATE.lastError || 'Backend API unavailable')+'</p>'
           + '<button class="ops-btn" onclick="window.opsLoadMasterCatalog && window.opsLoadMasterCatalog()">Retry</button>'
           + '</div>';
    } else {
      html = '<div class="mc-empty">'
           + '<span class="ic">📭</span>'
           + '<h4>No products match your filters</h4>'
           + '<p>Try clearing your search or removing filters.</p>'
           + '<button class="ops-btn" onclick="(window.__opsMcResetFilters||function(){})()">Reset filters</button>'
           + '</div>';
    }
    wrap.innerHTML = html;
    const p = document.getElementById('mcPaginate'); if (p) p.innerHTML = '';
  }

  function renderProductRow(p){
    const listings  = Array.isArray(p.listings)  ? p.listings  : [];
    const suppliers = Array.isArray(p.suppliers) ? p.suppliers : [];
    const tenantCount   = Number(p.tenant_count   || 0);
    const variantCount  = Number(p.variant_count  || 1);
    const listingCount  = Number(p.listing_count  || listings.length || 0);
    const supplierCount = Number(p.supplier_count || suppliers.length || 0);
    const hasSupplier   = Boolean(p.has_supplier) || supplierCount > 0;
    const opportunity   = !hasSupplier && tenantCount >= 2;
    const avgRetail     = Number(p.avg_retail_usd || 0);
    const minRetail     = Number(p.min_retail_usd || 0);
    const maxRetail     = Number(p.max_retail_usd || 0);
    const avgCost       = Number(p.avg_supplier_cost || 0);
    const margin        = (avgRetail && avgCost) ? (avgRetail - avgCost) : 0;

    /* ── Top strip pills ── */
    const pills = [];
    if (opportunity)        pills.push('<span class="mc-pill opportunity">🔥 Opportunity</span>');
    if (tenantCount >= 2)   pills.push('<span class="mc-pill tenant">'+tenantCount+' tenants</span>');
    else if (tenantCount===1) pills.push('<span class="mc-pill tenant">1 tenant</span>');
    if (variantCount > 0)   pills.push('<span class="mc-pill variant">'+variantCount+' var'+(variantCount===1?'':'s')+'</span>');
    if (!hasSupplier)       pills.push('<span class="mc-pill unsourced">⚠ Not sourced</span>');
    else if (supplierCount===1) pills.push('<span class="mc-pill sourced">✓ 1 supplier</span>');
    else                    pills.push('<span class="mc-pill multi">✓ '+supplierCount+' suppliers</span>');

    /* ── Image cell ── */
    const imgHtml = p.image_url
      ? '<div class="mc-img" onclick="event.stopPropagation();opsOpenLightbox && opsOpenLightbox(this.querySelector(\'img\'))"><img src="'+esc(p.image_url)+'" alt="" loading="lazy"></div>'
      : '<div class="mc-img" title="No image">📦</div>';

    /* ── Sold-by compact cell ── */
    let soldByHtml;
    if (listings.length){
      // Unique platforms used by this SKU (icon-only pills)
      const platforms = {};
      let priceSum = 0, priceCount = 0;
      listings.forEach(function(l){
        const cls = platformClass(l.platform);
        const lbl = l.platform_label || platformLabel(l.platform);
        platforms[cls] = lbl;
        const pr = Number(l.retail_price)||0;
        if (pr > 0){ priceSum += pr; priceCount++; }
      });
      const avgListPrice = priceCount ? (priceSum / priceCount) : 0;
      // Icon-only badges — matches queue's PLATFORM_BADGE (🛍️ for Shopify, W for Woo).
      // Full platform name shown as tooltip on hover.
      const PLAT_ICONS = { shopify: '🛍️', woocommerce: 'W', woo: 'W', other: '🌐' };
      const platHtml = Object.keys(platforms).map(function(cls){
        const ic = PLAT_ICONS[cls] || '🌐';
        return '<span class="plat '+cls+'" title="'+esc(platforms[cls])+'">'+ic+'</span>';
      }).join('');
      soldByHtml = '<div class="lbl">Sold by</div>'
                 + '<div class="stores">'
                 +   '<span>'+listings.length+' store'+(listings.length===1?'':'s')+'</span>'
                 +   platHtml
                 + '</div>'
                 + '<div class="price">'+(avgListPrice > 0 ? usd(avgListPrice) : '—')
                 +   (priceCount > 1 ? '<span class="sub" style="margin-left:5px;color:#64748b;font-weight:700;">avg</span>' : '')
                 + '</div>';
      if (minRetail && maxRetail && minRetail !== maxRetail){
        soldByHtml += '<div class="sub">'+usd(minRetail)+'–'+usd(maxRetail)+'</div>';
      }
    } else {
      soldByHtml = '<div class="lbl">Sold by</div><div class="empty">No listings</div>';
    }

    /* ── Sourced-via compact cell ── */
    let supHtml;
    if (suppliers.length){
      const top = suppliers.find(function(s){ return s.is_preferred; }) || suppliers[0];
      const meta = [];
      if (top.lead_days) meta.push(esc(top.lead_days)+'d lead');
      if (top.moq)       meta.push('MOQ '+num(top.moq));
      supHtml = '<div class="lbl">Sourced via</div>'
              + '<div class="nm" title="'+esc(top.supplier_name||'')+'">'
              +   (top.is_preferred ? '<span class="star">★</span>' : '')
              +   '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'
              +     esc(top.supplier_name || ('Supplier #'+(top.supplier_id||'?')))
              +   '</span>'
              + '</div>'
              + '<div class="meta"><span class="cost">'+usd(top.unit_cost_usd)+'</span>'
              +   (meta.length ? '<span style="margin:0 5px;color:#cbd5e1;">·</span>' + meta.join(' · ') : '')
              + '</div>';
      if (supplierCount > 1){
        supHtml += '<div class="warn" style="color:#5b21b6;">+'+(supplierCount-1)+' more · click to compare</div>';
      } else {
        supHtml += '<div class="warn">⚠ Single supplier — add backup</div>';
      }
    } else {
      supHtml = '<div class="lbl">Sourced via</div>'
              + '<div class="empty">⚠ Not linked</div>';
    }

    /* ── Margin compact cell ── */
    let marginHtml = '<div class="lbl">Margin / unit</div>';
    if (avgRetail){
      marginHtml += '<div class="retail">'+usd(avgRetail)+'</div>'
                  + '<div class="cost-line">Cost '+(avgCost ? usd(avgCost) : '—')+'</div>';
      if (margin > 0){
        marginHtml += '<div class="gain">+'+usd(margin)+' / unit</div>';
      }
    } else {
      marginHtml += '<div class="retail" style="color:#cbd5e1;">—</div>';
    }

    /* ── Actions cell ── */
    const primaryBtn = !hasSupplier
      ? '<button class="ops-btn gold" onclick="event.stopPropagation();window.__opsMcFindSupplier && window.__opsMcFindSupplier(\''+esc(p.sku)+'\')" title="Find supplier">💬 Find</button>'
      : (supplierCount === 1
        ? '<button class="ops-btn ghost" onclick="event.stopPropagation();window.__opsMcFindSupplier && window.__opsMcFindSupplier(\''+esc(p.sku)+'\')" title="Add backup supplier">+ Backup</button>'
        : '<button class="ops-btn ghost" onclick="event.stopPropagation();openDetailModal(\''+esc(p.sku)+'\')" title="Compare suppliers">⚖ Compare</button>');
    const detailsBtn = '<button class="ops-btn" onclick="event.stopPropagation();openDetailModal(\''+esc(p.sku)+'\')" title="Open SKU details">📋 Details</button>';

    /* ── Top strip ── */
    const stripHtml = '<div class="mc-strip">'
                    +   '<span class="sku">SKU '+esc(p.sku || '—')+'</span>'
                    +   '<span class="sep">·</span>'
                    +   '<span class="meta">'+listingCount+' listing'+(listingCount===1?'':'s')+'</span>'
                    +   (p.category ? '<span class="sep">·</span><span class="meta">'+esc(p.category)+'</span>' : '')
                    +   '<span class="mc-strip-right">'+pills.join('')+'</span>'
                    + '</div>';

    /* ── Body grid (single horizontal row) ── */
    const bodyHtml = '<div class="mc-body">'
                   +   imgHtml
                   +   '<div class="mc-cell-name">'
                   +     '<div class="nm" title="'+esc(p.product_name||'')+'">'+esc(p.product_name || '(Unnamed product)')+'</div>'
                   +     '<div class="mt">'+(p.category ? '<span class="cat">'+esc(p.category)+'</span>' : '')
                   +     '<span style="color:#94a3b8;">'+listingCount+' across stores</span></div>'
                   +   '</div>'
                   +   '<div class="mc-cell-sold">'+soldByHtml+'</div>'
                   +   '<div class="mc-cell-sup">'+supHtml+'</div>'
                   +   '<div class="mc-cell-margin">'+marginHtml+'</div>'
                   +   '<div class="mc-cell-actions">'+detailsBtn+primaryBtn+'</div>'
                   + '</div>';

    return '<div class="mc-row'+(opportunity ? ' is-opportunity' : '')+'" onclick="openDetailModal(\''+esc(p.sku)+'\')">'
         +   stripHtml
         +   bodyHtml
         + '</div>';
  }

  function renderList(){
    const wrap = document.getElementById('mcListWrap');
    if (!wrap) return;
    if (!STATE.products.length){
      if (!STATE.loaded) renderEmpty('no_data'); else renderEmpty('empty');
      return;
    }
    wrap.innerHTML = '<div class="mc-list">' + STATE.products.map(renderProductRow).join('') + '</div>';
    renderPagination();
  }

  function renderPagination(){
    const el = document.getElementById('mcPaginate');
    if (!el) return;
    const total = STATE.total;
    if (!total){ el.innerHTML = ''; return; }
    const pp = STATE.limit;
    const totalPages = Math.max(1, Math.ceil(total / pp));
    const curPage = Math.min(totalPages, Math.max(1, Math.floor(STATE.offset / pp) + 1));

    // Build compact page-number sequence with ellipses
    function pageSequence(cur, tot){
      const seq = [];
      if (tot <= 7){
        for (let i = 1; i <= tot; i++) seq.push(i);
        return seq;
      }
      // Always show first
      seq.push(1);
      // Window around current
      const left = Math.max(2, cur - 1);
      const right = Math.min(tot - 1, cur + 1);
      if (left > 2) seq.push('…');
      for (let i = left; i <= right; i++) seq.push(i);
      if (right < tot - 1) seq.push('…');
      // Always show last
      seq.push(tot);
      return seq;
    }

    const seq = pageSequence(curPage, totalPages);
    const ppOptions = [10, 25, 50, 100, 200];
    if (ppOptions.indexOf(pp) === -1) ppOptions.push(pp);
    ppOptions.sort(function(a,b){ return a-b; });

    let pagesHtml = '<button class="mc-pag-btn nav" data-pag-prev '+(curPage<=1?'disabled':'')+' title="Previous page">‹</button>';
    seq.forEach(function(s){
      if (s === '…') pagesHtml += '<span class="mc-pag-ellipsis">…</span>';
      else pagesHtml += '<button class="mc-pag-btn '+(s===curPage?'active':'')+'" data-pag-page="'+s+'">'+s+'</button>';
    });
    pagesHtml += '<button class="mc-pag-btn nav" data-pag-next '+(curPage>=totalPages?'disabled':'')+' title="Next page">›</button>';

    el.innerHTML = '<div class="mc-paginate">'
                 +   '<div class="mc-pag-pages">'+pagesHtml+'</div>'
                 +   '<div class="mc-pag-jump">'
                 +     '<span>To page</span>'
                 +     '<input type="number" min="1" max="'+totalPages+'" id="mcPagJumpInput" placeholder="'+curPage+'">'
                 +     '<span>page</span>'
                 +     '<button id="mcPagJumpBtn">Confirm</button>'
                 +   '</div>'
                 +   '<div class="mc-pag-total">total <b>'+num(total)+'</b> items</div>'
                 +   '<div class="mc-pag-pp">'
                 +     '<select id="mcPagPpSel" title="Items per page">'
                 +       ppOptions.map(function(n){
                            return '<option value="'+n+'"'+(n===pp?' selected':'')+'>'+n+' items/page</option>';
                          }).join('')
                 +     '</select>'
                 +   '</div>'
                 + '</div>';

    // ── Wire up handlers ──
    function gotoPage(target){
      target = Math.max(1, Math.min(totalPages, target|0));
      if (target === curPage || STATE.loadingList) return;
      STATE.offset = (target - 1) * pp;
      loadList(true); // true = replace, not append
      // Scroll list into view for clear feedback
      const list = document.getElementById('mcListWrap');
      if (list && list.scrollIntoView) list.scrollIntoView({behavior:'smooth', block:'start'});
    }

    el.querySelectorAll('[data-pag-page]').forEach(function(b){
      b.addEventListener('click', function(){ gotoPage(Number(b.getAttribute('data-pag-page'))); });
    });
    const prev = el.querySelector('[data-pag-prev]');
    if (prev) prev.addEventListener('click', function(){ gotoPage(curPage - 1); });
    const next = el.querySelector('[data-pag-next]');
    if (next) next.addEventListener('click', function(){ gotoPage(curPage + 1); });

    const jumpInput = document.getElementById('mcPagJumpInput');
    const jumpBtn   = document.getElementById('mcPagJumpBtn');
    function doJump(){
      const v = parseInt(jumpInput.value, 10);
      if (!v || v < 1 || v > totalPages){
        if (typeof opsToast === 'function') opsToast('Page must be between 1 and '+totalPages, 'error');
        return;
      }
      gotoPage(v);
    }
    if (jumpBtn) jumpBtn.addEventListener('click', doJump);
    if (jumpInput) jumpInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); doJump(); }
    });

    const ppSel = document.getElementById('mcPagPpSel');
    if (ppSel) ppSel.addEventListener('change', function(){
      const newPp = parseInt(ppSel.value, 10) || 50;
      if (newPp === STATE.limit) return;
      STATE.limit = newPp;
      STATE.offset = 0; // reset to first page when page size changes
      loadList(true);
    });
  }

  function renderCountChip(){
    const chip = document.getElementById('mcCountChip');
    if (chip) chip.innerHTML = '<span class="num mc-num">'+num(STATE.total)+'</span> product'+(STATE.total===1?'':'s');
  }

  /* ════ API calls ═════════════════════════════════════════════════ */
  function buildQuery(){
    const p = STATE.params;
    const q = new URLSearchParams();
    Object.keys(p).forEach(function(k){ if (p[k] !== '' && p[k] != null) q.set(k, p[k]); });
    q.set('limit', String(STATE.limit));
    q.set('offset', String(STATE.offset));
    return q.toString();
  }

  async function loadList(reset){
    if (STATE.loadingList) return;
    STATE.loadingList = true;
    if (reset){
      // Clear products + show loader, but leave STATE.offset alone —
      // the caller (pagination jump, filter reset) sets the offset they want.
      STATE.products = [];
      renderListLoading();
    }
    try{
      const url = '/ops/api/master-catalog/?' + buildQuery();
      const r = await opsFetch(url);
      if (!r.ok){
        STATE.lastError = (r.data && r.data.error) || ('HTTP '+r.status);
        if (reset && !STATE.products.length){
          renderEmpty('error');
        } else {
          toast('Could not load more products', 'error');
        }
        return;
      }
      const d = r.data || {};
      const products = Array.isArray(d.products) ? d.products : [];
      if (reset) STATE.products = products;
      else       STATE.products = STATE.products.concat(products);
      STATE.total = Number(d.total || STATE.products.length || 0);
      STATE.loaded = true;
      renderList();
      renderCountChip();
    } catch(err){
      STATE.lastError = String(err && err.message || err);
      if (reset) renderEmpty('error');
      else toast('Failed to load more products', 'error');
    } finally {
      STATE.loadingList = false;
    }
  }
  function reloadList(){
    // Used when filters/search/sort change — start fresh from page 1
    STATE.offset = 0;
    loadList(true);
  }

  async function loadStats(){
    if (STATE.loadingStats) return;
    STATE.loadingStats = true;
    try{
      const r = await opsFetch('/ops/api/master-catalog/stats/');
      if (r.ok){ STATE.stats = r.data || {}; renderStats(); }
      else { renderStatsFallback(); }
    } catch(err){ renderStatsFallback(); }
    finally { STATE.loadingStats = false; }
  }

  async function loadFilters(){
    try{
      const r = await opsFetch('/ops/api/master-catalog/filters/');
      if (r.ok){ STATE.filters = r.data || {}; renderFilters(); }
    } catch(err){ /* graceful */ }
  }

  async function onSyncClick(){
    if (STATE.syncing) return;
    STATE.syncing = true;
    const btn = document.getElementById('mcSyncBtn');
    const orig = btn.innerHTML;
    btn.innerHTML = '⏳ Syncing…';
    btn.disabled = true;
    toast('Sync started — refreshing all tenant stores…', 'info');
    try{
      const r = await opsFetch('/ops/api/master-catalog/sync/', { method:'POST', body:{} });
      if (r.ok){
        const synced = (r.data && r.data.synced) || 0;
        const errors = (r.data && r.data.errors) || 0;
        toast('Synced '+synced+' store'+(synced===1?'':'s')+(errors ? ' · '+errors+' failed' : '')+'.', errors ? 'warn' : 'success');
      } else {
        toast('Sync failed: ' + ((r.data && r.data.error) || 'Backend error'), 'error');
      }
    } catch(err){
      toast('Sync failed: ' + (err && err.message || err), 'error');
    } finally {
      btn.innerHTML = orig;
      btn.disabled = false;
      STATE.syncing = false;
      loadStats();
      reloadList();
    }
  }

  /* ════ SKU detail modal ══════════════════════════════════════════ */
  function closeDetailModal(){
    const m = document.getElementById('opsMcModal');
    if (m) m.classList.remove('is-open');
  }

  window.openDetailModal = async function(sku){
    if (!sku) return;
    const m = document.getElementById('opsMcModal');
    if (!m) return;
    m.classList.add('is-open');
    document.getElementById('mcmTitle').textContent = sku;
    document.getElementById('mcmSubtitle').innerHTML = '<span style="color:#94a3b8;">Loading…</span>';
    document.getElementById('mcmHeadImg').innerHTML = '📦';
    document.getElementById('mcmBody').innerHTML =
      '<div class="ops-loading" style="text-align:center;padding:40px 0;color:#94a3b8;font-weight:700;">Loading SKU detail…</div>';
    const findBtn = document.getElementById('mcmFindSupplier');
    const sendBtn = document.getElementById('mcmSendQuote');
    if (findBtn) findBtn.onclick = function(){ window.__opsMcFindSupplier && window.__opsMcFindSupplier(sku); };
    if (sendBtn) sendBtn.onclick = function(){ window.__opsMcSendToSupplier && window.__opsMcSendToSupplier(sku); };

    try{
      const r = await opsFetch('/ops/api/master-catalog/sku/' + encodeURIComponent(sku) + '/');
      if (!r.ok){
        const fb = (STATE.products || []).find(function(p){ return String(p.sku) === String(sku); });
        if (fb){ renderDetailModal(fb, { fallback: true }); return; }
        document.getElementById('mcmBody').innerHTML =
          '<div class="mcm-block"><h5><span class="accent"></span> Error</h5><div style="color:#92400e;font-weight:700;">Could not load SKU detail: '+esc((r.data && r.data.error) || 'Backend error')+'</div></div>';
        return;
      }
      // API wraps payload as {ok, product, ...} — unwrap before rendering.
      const payload = (r.data && r.data.product) ? r.data.product : (r.data || {});
      renderDetailModal(payload);
    } catch(err){
      document.getElementById('mcmBody').innerHTML =
        '<div class="mcm-block"><h5><span class="accent"></span> Error</h5><div style="color:#92400e;font-weight:700;">'+esc(err && err.message || err)+'</div></div>';
    }
  };

  function renderDetailModal(p, opts){
    opts = opts || {};
    const listings  = Array.isArray(p.listings)        ? p.listings        : [];
    const suppliers = Array.isArray(p.suppliers)       ? p.suppliers       : [];
    const variants  = Array.isArray(p.variants_detail) ? p.variants_detail : [];
    const orders    = Array.isArray(p.recent_orders)   ? p.recent_orders   : [];
    const totalOrders = Number(p.total_orders || 0);
    const tenantCount = Number(p.tenant_count || 0);
    const variantCount= Number(p.variant_count || variants.length || 0);

    document.getElementById('mcmTitle').textContent = p.product_name || '(Unnamed product)';
    document.getElementById('mcmSubtitle').innerHTML =
        '<span class="mc-sku">SKU '+esc(p.sku || '—')+'</span>'
      + '<span class="mc-pill tenant" style="text-transform:none;">'+tenantCount+' tenant'+(tenantCount===1?'':'s')+'</span>'
      + '<span class="mc-pill variant" style="text-transform:none;">'+variantCount+' variant'+(variantCount===1?'':'s')+'</span>'
      + (totalOrders ? '<span class="mc-pill multi" style="text-transform:none;">'+num(totalOrders)+' orders</span>' : '')
      + (opts.fallback ? '<span style="color:#92400e;">· using cached data</span>' : '');

    const imgEl = document.getElementById('mcmHeadImg');
    if (p.image_url){
      imgEl.innerHTML = '<img src="'+esc(p.image_url)+'" alt="">';
      imgEl.onclick = function(){ const i = imgEl.querySelector('img'); if (i && typeof opsOpenLightbox === 'function') opsOpenLightbox(i); };
    } else {
      imgEl.innerHTML = '📦';
      imgEl.onclick = null;
    }

    const whereHtml = listings.length
      ? listings.map(function(l){
          const platCls = platformClass(l.platform);
          const platLbl = l.platform_label || platformLabel(l.platform);
          const owner   = l.owner_username || l.owner_email || '—';
          const pillCls = platCls === 'shopify' ? 'sourced' : (platCls === 'woo' ? 'tenant' : 'variant');
          return '<tr>'
               +   '<td class="nm">'+esc(l.store_name || owner)+'</td>'
               +   '<td>'+esc(owner)+'</td>'
               +   '<td><span class="mc-pill '+pillCls+'" style="text-transform:none;">'+esc(platLbl)+'</span></td>'
               +   '<td class="price">'+usd(l.retail_price)+'</td>'
               + '</tr>';
        }).join('')
      : '<tr><td colspan="4" style="color:#94a3b8;">No listings on file.</td></tr>';

    let bestIdx = -1;
    if (suppliers.length){
      let bestCost = Infinity;
      suppliers.forEach(function(s,i){
        const c = Number(s.unit_cost_usd || 0);
        if (c > 0 && c < bestCost){ bestCost = c; bestIdx = i; }
      });
    }
    const suppliersHtml = suppliers.length
      ? suppliers.map(function(s,i){
          const tag = i===bestIdx
            ? '<span class="mc-pill sourced" style="text-transform:none;">Best price</span>'
            : (s.is_preferred ? '<span class="mc-pill tenant" style="text-transform:none;">Preferred</span>' : '');
          return '<tr'+(i===bestIdx ? ' class="best"' : '')+'>'
               +   '<td class="nm">'+(s.is_preferred ? '<span style="color:#f4c430;">★ </span>' : '')+esc(s.supplier_name || ('Supplier #'+(s.supplier_id||'?')))+'</td>'
               +   '<td class="price">'+usd(s.unit_cost_usd)+'</td>'
               +   '<td>'+(s.lead_days ? esc(s.lead_days)+'d' : '—')+'</td>'
               +   '<td>'+(s.moq ? num(s.moq) : '—')+'</td>'
               +   '<td>'+tag+'</td>'
               + '</tr>';
        }).join('')
      : '<tr><td colspan="5" style="color:#92400e;font-weight:700;">⚠ Not sourced yet. Use "Find supplier" to add one.</td></tr>';

    const variantsHtml = variants.length
      ? variants.map(function(v){
          return '<tr>'
               +   '<td class="nm">'+esc(v.title || v.name || ('Variant #'+(v.id||'?')))+'</td>'
               +   '<td>'+esc(v.sku || '—')+'</td>'
               +   '<td class="price">'+usd(v.price || v.retail_price)+'</td>'
               +   '<td>'+(v.inventory_quantity != null ? num(v.inventory_quantity) : '—')+'</td>'
               + '</tr>';
        }).join('')
      : '<tr><td colspan="4" style="color:#94a3b8;">No variant details on file.</td></tr>';

    const ordersHtml = orders.length
      ? orders.map(function(o){
          return '<tr>'
               +   '<td class="nm">'+esc(o.order_number || o.order_id || ('#'+(o.id||'?')))+'</td>'
               +   '<td>'+esc(o.store_name || o.tenant || '—')+'</td>'
               +   '<td>'+esc(o.status || '—')+'</td>'
               +   '<td>'+(o.qty ? num(o.qty) : (o.quantity ? num(o.quantity) : '—'))+'</td>'
               +   '<td class="price">'+usd(o.total || o.amount || o.line_total)+'</td>'
               +   '<td>'+(o.created_at ? esc(timeAgo(o.created_at)) : '—')+'</td>'
               + '</tr>';
        }).join('')
      : '<tr><td colspan="6" style="color:#94a3b8;">No recent orders found for this SKU.</td></tr>';

    document.getElementById('mcmBody').innerHTML =
        '<div class="mcm-block">'
      +   '<h5><span class="accent"></span> Where it\'s sold ('+listings.length+')</h5>'
      +   '<table class="mcm-table">'
      +     '<thead><tr><th>Store</th><th>Owner</th><th>Platform</th><th>Retail</th></tr></thead>'
      +     '<tbody>'+whereHtml+'</tbody>'
      +   '</table>'
      + '</div>'
      + '<div class="mcm-block">'
      +   '<h5><span class="accent"></span> Sourcing comparison ('+suppliers.length+')</h5>'
      +   '<table class="mcm-table">'
      +     '<thead><tr><th>Supplier</th><th>Unit cost</th><th>Lead</th><th>MOQ</th><th></th></tr></thead>'
      +     '<tbody>'+suppliersHtml+'</tbody>'
      +   '</table>'
      + '</div>'
      + '<div class="mcm-block">'
      +   '<h5><span class="accent"></span> Variants ('+(variants.length || variantCount)+')</h5>'
      +   '<table class="mcm-table">'
      +     '<thead><tr><th>Variant</th><th>SKU</th><th>Price</th><th>Stock</th></tr></thead>'
      +     '<tbody>'+variantsHtml+'</tbody>'
      +   '</table>'
      + '</div>'
      + '<div class="mcm-block">'
      +   '<h5><span class="accent"></span> Recent orders'+(totalOrders ? ' · '+num(totalOrders)+' total' : '')+'</h5>'
      +   '<table class="mcm-table">'
      +     '<thead><tr><th>Order</th><th>Store</th><th>Status</th><th>Qty</th><th>Total</th><th>When</th></tr></thead>'
      +     '<tbody>'+ordersHtml+'</tbody>'
      +   '</table>'
      + '</div>';
  }

  /* ════ Public hooks ══════════════════════════════════════════════ */
  window.__opsMcResetFilters   = resetFilters;
  window.__opsMcFindSupplier   = function(sku){ toast('Find-supplier flow coming soon for SKU ' + sku, 'info'); };
  window.__opsMcSendToSupplier = function(sku){ toast('Send-for-quote flow coming soon for SKU ' + sku, 'info'); };

  /* ════ Section loader ════════════════════════════════════════════ */
  let SHELL_BUILT = false;
  window.opsLoadMasterCatalog = async function(){
    const acts = document.getElementById('opsSectionActions');
    if (acts) acts.innerHTML = '';
    if (!SHELL_BUILT){ buildShell(); SHELL_BUILT = true; }
    loadStats();
    loadFilters();
    reloadList();
  };
})();
</script>

<!-- Procurement tracker — Processing orders that are paid and being
     produced / shipped from supplier. -->
<style>
  /* ─── Procurement · scoped styles ────────────────────────────── */
  #opsProcurementRoot .pr-kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
  #opsProcurementRoot .pr-kpi{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(15,23,42,.02),0 8px 24px -20px rgba(15,23,42,.16);}
  #opsProcurementRoot .pr-kpi::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,#6366f1,#a855f7);}
  #opsProcurementRoot .pr-kpi.amber::before{background:linear-gradient(180deg,#f59e0b,#d97706);}
  #opsProcurementRoot .pr-kpi.green::before{background:linear-gradient(180deg,#10b981,#059669);}
  #opsProcurementRoot .pr-kpi.red::before{background:linear-gradient(180deg,#ef4444,#dc2626);}
  #opsProcurementRoot .pr-kpi .lbl{font-size:10.5px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.08em;}
  #opsProcurementRoot .pr-kpi .v{font-size:26px;font-weight:900;color:#0f172a;margin-top:4px;letter-spacing:-.025em;font-variant-numeric:tabular-nums;}
  #opsProcurementRoot .pr-kpi .sub{font-size:11.5px;color:#94a3b8;margin-top:4px;font-weight:600;}

  #opsProcurementRoot .pr-toolbar{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;box-shadow:0 1px 0 rgba(15,23,42,.02),0 8px 24px -20px rgba(15,23,42,.16);}
  #opsProcurementRoot .pr-chips{display:flex;flex-wrap:wrap;gap:6px;}
  #opsProcurementRoot .pr-chip{padding:6px 11px;border-radius:999px;background:#f1f5f9;border:1px solid transparent;font-size:12px;font-weight:700;color:#475569;cursor:pointer;transition:all .12s ease;display:inline-flex;align-items:center;gap:5px;}
  #opsProcurementRoot .pr-chip:hover{background:#e2e8f0;}
  #opsProcurementRoot .pr-chip.active{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(168,85,247,.14));color:#0f172a;border-color:rgba(99,102,241,.4);box-shadow:inset 0 0 0 1px rgba(99,102,241,.15);}
  #opsProcurementRoot .pr-chip .ct{font-size:10.5px;font-weight:900;color:#64748b;padding:1px 7px;border-radius:999px;background:#fff;}
  #opsProcurementRoot .pr-chip.active .ct{background:rgba(244,196,48,.25);color:#7a5a00;}
  #opsProcurementRoot .pr-asg{padding:7px 12px;border-radius:10px;background:#fff;border:1px solid #e5e7eb;font-size:12.5px;font-weight:700;color:#334155;cursor:pointer;outline:none;}

  #opsProcurementRoot .pr-list{display:flex;flex-direction:column;gap:10px;}
  #opsProcurementRoot .pr-row{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;box-shadow:0 1px 0 rgba(15,23,42,.02),0 12px 32px -22px rgba(15,23,42,.18);cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;}
  #opsProcurementRoot .pr-row:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(15,23,42,.02),0 18px 36px -20px rgba(15,23,42,.25);border-color:rgba(99,102,241,.3);}
  #opsProcurementRoot .pr-thumb{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,#f1f5f9,#e2e8f0) center/cover no-repeat;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px;color:#94a3b8;flex-shrink:0;}
  #opsProcurementRoot .pr-main{min-width:0;display:flex;flex-direction:column;gap:5px;}
  #opsProcurementRoot .pr-top-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  #opsProcurementRoot .pr-ds{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;color:#7a5a00;letter-spacing:.01em;}
  #opsProcurementRoot .pr-prod-line{font-size:13.5px;font-weight:700;color:#0f172a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #opsProcurementRoot .pr-prod-meta{font-size:11.5px;font-weight:600;color:#64748b;}
  #opsProcurementRoot .pr-meta-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #opsProcurementRoot .pr-cust{font-size:11.5px;font-weight:600;color:#64748b;}
  #opsProcurementRoot .pr-supplier{font-size:11.5px;font-weight:700;color:#475569;padding:2px 8px;border-radius:999px;background:#eef2ff;border:1px solid rgba(99,102,241,.18);}
  #opsProcurementRoot .pr-supplier.empty{color:#94a3b8;background:#f8fafc;border:1px dashed #cbd5e1;font-weight:600;font-style:italic;}
  #opsProcurementRoot .pr-age{font-size:11.5px;font-weight:800;color:#475569;}
  #opsProcurementRoot .pr-age.late{color:#dc2626;}

  #opsProcurementRoot .pr-status-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:.005em;display:inline-flex;align-items:center;gap:5px;}
  #opsProcurementRoot .pr-st-not_started{background:#f1f5f9;color:#475569;box-shadow:inset 0 0 0 1px #e2e8f0;}
  #opsProcurementRoot .pr-st-po_sent{background:linear-gradient(135deg,#ddd6fe,#c4b5fd);color:#5b21b6;}
  #opsProcurementRoot .pr-st-producing{background:linear-gradient(135deg,#dbeafe,#93c5fd);color:#1e40af;}
  #opsProcurementRoot .pr-st-ready{background:linear-gradient(135deg,#d1fae5,#6ee7b7);color:#065f46;}
  #opsProcurementRoot .pr-st-delayed{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;}

  #opsProcurementRoot .pr-actions{display:flex;align-items:center;gap:6px;}
  #opsProcurementRoot .pr-dd{position:relative;}
  #opsProcurementRoot .pr-dd-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 18px 36px -20px rgba(15,23,42,.4);padding:6px;min-width:200px;z-index:30;display:none;}
  #opsProcurementRoot .pr-dd.open .pr-dd-menu{display:block;}
  #opsProcurementRoot .pr-dd-item{padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:#0f172a;cursor:pointer;display:flex;align-items:center;gap:8px;}
  #opsProcurementRoot .pr-dd-item:hover{background:#f1f5f9;}
  #opsProcurementRoot .pr-dd-item .dot{width:8px;height:8px;border-radius:999px;flex-shrink:0;}

  #opsProcurementRoot .pr-empty{padding:60px 20px;text-align:center;color:#64748b;background:#fff;border:1px dashed rgba(15,23,42,.1);border-radius:16px;}
  #opsProcurementRoot .pr-empty .ic{font-size:42px;margin-bottom:10px;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  #opsProcurementRoot .pr-empty h3{font-size:16px;font-weight:900;margin:0 0 4px;color:#0f172a;}
  #opsProcurementRoot .pr-empty p{margin:0;font-size:13px;}
</style>

<div id="opsProcurementRoot">
  <div class="ops-loading">Loading Procurement tracker…</div>
</div>

<script>
  (function(){
    const PR = {
      items: [],
      filter: 'all',       // all | not_started | po_sent | producing | ready | delayed
      assignee: 'all',     // all | mine
      assignees: [],
    };

    const STATUS_LABEL = {
      not_started: 'Not started',
      po_sent:     'PO sent',
      producing:   'Producing',
      ready:       'Ready to ship',
      delayed:     'Delayed',
    };
    const STATUS_DOT = {
      not_started: '#94a3b8',
      po_sent:     '#a855f7',
      producing:   '#3b82f6',
      ready:       '#10b981',
      delayed:     '#ef4444',
    };

    function esc(s){ return (window.opsEsc || (x => String(x==null?'':x)))(s); }

    function daysAgoFromIso(iso){
      if (!iso) return null;
      const t = new Date(iso).getTime();
      if (!t) return null;
      const days = Math.floor((Date.now() - t) / 86400000);
      return days;
    }

    function openOrder(orderId){
      if (typeof window.opsOpenOrderModal === 'function'){
        window.opsOpenOrderModal(orderId);
      } else {
        if (typeof window.opsSwitchView === 'function'){
          try { window.opsSwitchView('queue'); } catch(e){}
        }
        if (typeof window.opsToast === 'function'){
          window.opsToast('Open detail from Queue — modal is being built.', 'error');
        }
      }
    }

    function passesFilter(o){
      const st = o.procurement_status || 'not_started';
      if (PR.filter !== 'all' && PR.filter !== st) return false;
      const me = (window.OPS && OPS.me && OPS.me.user) ? OPS.me.user.display_name : '';
      if (PR.assignee === 'mine' && o.assignee !== me) return false;
      if (PR.assignee !== 'all' && PR.assignee !== 'mine' && o.assignee !== PR.assignee) return false;
      return true;
    }

    async function updateStatus(orderId, status, ev){
      ev && ev.stopPropagation();
      const resp = await opsFetch('/ops/api/order/' + orderId + '/procure/', {
        method: 'POST', body: { procurement_status: status }
      });
      if (resp.ok){
        opsToast('Status set to ' + STATUS_LABEL[status], 'success');
        loadProcurement();
      } else if (resp.status === 501) {
        opsToast('Procurement endpoint not ready yet', 'error');
      } else {
        opsToast((resp.data && resp.data.error) || 'Could not update', 'error');
      }
    }

    async function markReady(orderId, ev){
      ev && ev.stopPropagation();
      await updateStatus(orderId, 'ready', null);
      // Jump to Shipping after marking ready
      if (typeof window.opsSwitchView === 'function'){
        setTimeout(() => window.opsSwitchView('shipping'), 600);
      }
    }

    function toggleDd(orderId, ev){
      ev && ev.stopPropagation();
      const all = document.querySelectorAll('#opsProcurementRoot .pr-dd');
      all.forEach(el => {
        if (el.dataset.oid !== String(orderId)) el.classList.remove('open');
      });
      const me = document.querySelector(`#opsProcurementRoot .pr-dd[data-oid="${orderId}"]`);
      if (me) me.classList.toggle('open');
    }

    function renderKpis(){
      const counts = { po_sent:0, producing:0, ready:0, delayed:0 };
      PR.items.forEach(o => {
        const s = o.procurement_status || 'not_started';
        if (counts.hasOwnProperty(s)) counts[s]++;
      });
      const grid = document.getElementById('prKpiGrid');
      if (!grid) return;
      grid.innerHTML = `
        <div class="pr-kpi">
          <div class="lbl">PO sent</div>
          <div class="v">${counts.po_sent}</div>
          <div class="sub">Awaiting production start</div>
        </div>
        <div class="pr-kpi amber">
          <div class="lbl">In production</div>
          <div class="v">${counts.producing}</div>
          <div class="sub">Being made by supplier</div>
        </div>
        <div class="pr-kpi green">
          <div class="lbl">Ready to ship</div>
          <div class="v">${counts.ready}</div>
          <div class="sub">Awaiting dispatch</div>
        </div>
        <div class="pr-kpi red">
          <div class="lbl">Delayed</div>
          <div class="v">${counts.delayed}</div>
          <div class="sub">Need attention</div>
        </div>
      `;
    }

    function renderChips(){
      const counts = { all: PR.items.length, not_started:0, po_sent:0, producing:0, ready:0, delayed:0 };
      PR.items.forEach(o => {
        const s = o.procurement_status || 'not_started';
        if (counts.hasOwnProperty(s)) counts[s]++;
      });
      const wrap = document.getElementById('prChips');
      if (!wrap) return;
      const chip = (key, label) => `
        <span class="pr-chip ${PR.filter===key?'active':''}" data-f="${key}">
          ${esc(label)} <span class="ct">${counts[key]||0}</span>
        </span>`;
      wrap.innerHTML =
        chip('all',         'All') +
        chip('not_started', 'Not started') +
        chip('po_sent',     'PO sent') +
        chip('producing',   'Producing') +
        chip('ready',       'Ready') +
        chip('delayed',     'Delayed');
      wrap.querySelectorAll('.pr-chip').forEach(el => {
        el.addEventListener('click', () => {
          PR.filter = el.dataset.f;
          renderChips();
          renderList();
        });
      });
    }

    function renderAssignees(){
      const sel = document.getElementById('prAsg');
      if (!sel) return;
      const opts = ['<option value="all">All assignees</option>',
                    '<option value="mine">My orders only</option>'];
      PR.assignees.forEach(a => {
        opts.push(`<option value="${esc(a)}">${esc(a)}</option>`);
      });
      sel.innerHTML = opts.join('');
      sel.value = PR.assignee;
    }

    function renderList(){
      const wrap = document.getElementById('prList');
      if (!wrap) return;
      const list = PR.items.filter(passesFilter);
      if (!list.length){
        wrap.innerHTML = `
          <div class="pr-empty">
            <div class="ic">🏭</div>
            <h3>No orders here</h3>
            <p>Nothing matches the current filter — try another chip.</p>
          </div>`;
        return;
      }
      wrap.innerHTML = '<div class="pr-list">' + list.map(o => {
        const st = o.procurement_status || 'not_started';
        const days = daysAgoFromIso(o.paid_at_iso);
        const lateCls = (days != null && days > 7 && st !== 'ready') ? 'late' : '';
        const ageTxt = days != null ? (days === 0 ? 'Paid today' : `${days}d since paid`) : '';
        const thumb = o.product_image_url
          ? `<div class="pr-thumb" style="background-image:url(${esc(o.product_image_url)});"></div>`
          : `<div class="pr-thumb">📦</div>`;
        const supplier = o.supplier_name
          ? `<span class="pr-supplier">${esc(o.supplier_name)}</span>`
          : `<span class="pr-supplier empty">No supplier linked</span>`;
        const items = ['not_started','po_sent','producing','ready','delayed'].map(s => `
          <div class="pr-dd-item" onclick="window.__prSet(${o.id}, '${s}', event)">
            <span class="dot" style="background:${STATUS_DOT[s]};"></span>${esc(STATUS_LABEL[s])}
          </div>`).join('');
        return `
          <div class="pr-row" onclick="window.__prOpen(${o.id})">
            ${thumb}
            <div class="pr-main">
              <div class="pr-top-line">
                <span class="pr-ds">${esc(o.ds_order_ref)}</span>
                <span class="pr-status-pill pr-st-${st}"><span class="dot" style="background:${STATUS_DOT[st]};width:6px;height:6px;border-radius:999px;display:inline-block;"></span>${esc(STATUS_LABEL[st])}</span>
                ${supplier}
              </div>
              <div class="pr-prod-line">${esc(o.product_name || 'Product')} <span class="pr-prod-meta">× ${o.item_count || 1}</span></div>
              <div class="pr-meta-line">
                <span class="pr-cust">${esc(o.flag || '')} ${esc(o.customer_name || 'Customer')}${o.ship_city ? ' · '+esc(o.ship_city) : ''}</span>
                <span class="pr-age ${lateCls}">${esc(ageTxt)}</span>
                ${o.assignee ? `<span style="font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:999px;background:${esc(o.assignee_color || '#6366f1')};">${esc(o.assignee)}</span>` : ''}
              </div>
            </div>
            <div class="pr-actions" onclick="event.stopPropagation();">
              <div class="pr-dd" data-oid="${o.id}">
                <button class="ops-btn ghost sm" onclick="window.__prToggleDd(${o.id}, event)">Update status ▾</button>
                <div class="pr-dd-menu">${items}</div>
              </div>
              ${st !== 'ready' ? `<button class="ops-btn success sm" onclick="window.__prReady(${o.id}, event)">Mark Ready to Ship</button>` : ''}
            </div>
          </div>`;
      }).join('') + '</div>';
    }

    function renderShell(){
      const root = document.getElementById('opsProcurementRoot');
      root.innerHTML = `
        <div id="prKpiGrid" class="pr-kpi-grid">
          <div class="ops-loading">Loading KPIs…</div>
        </div>
        <div class="pr-toolbar">
          <div id="prChips" class="pr-chips"></div>
          <select id="prAsg" class="pr-asg"></select>
        </div>
        <div id="prList"><div class="ops-loading">Loading orders…</div></div>
      `;
      const sel = document.getElementById('prAsg');
      sel.addEventListener('change', () => { PR.assignee = sel.value; renderList(); });

      // close dropdowns on outside click
      document.addEventListener('click', (e) => {
        if (!e.target.closest('#opsProcurementRoot .pr-dd')){
          document.querySelectorAll('#opsProcurementRoot .pr-dd.open').forEach(el => el.classList.remove('open'));
        }
      });
    }

    async function loadProcurement(){
      const resp = await opsFetch('/ops/api/orders/?status=processing');
      if (!resp.ok){
        PR.items = [];
        renderKpis();
        renderChips();
        renderAssignees();
        const wrap = document.getElementById('prList');
        if (wrap){
          if (resp.status === 501 || resp.status === 404){
            wrap.innerHTML = `<div class="pr-empty"><div class="ic">⏳</div><h3>Loading from Queue desk…</h3><p>Order list endpoint isn&#39;t ready yet. The tracker will populate as soon as it&#39;s online.</p></div>`;
          } else {
            wrap.innerHTML = `<div class="pr-empty"><div class="ic">⚠️</div><h3>Could not load</h3><p>${esc((resp.data && resp.data.error) || 'Try refreshing in a moment.')}</p></div>`;
          }
        }
        return;
      }
      const items = (resp.data && (resp.data.orders || resp.data.results || resp.data.items)) || [];
      PR.items = Array.isArray(items) ? items : [];

      const set = new Set();
      PR.items.forEach(o => { if (o.assignee) set.add(o.assignee); });
      PR.assignees = Array.from(set).sort();

      renderKpis();
      renderChips();
      renderAssignees();
      renderList();
    }

    window.__prOpen     = openOrder;
    window.__prSet      = updateStatus;
    window.__prReady    = markReady;
    window.__prToggleDd = toggleDd;

    window.opsLoadProcurement = function(){
      renderShell();
      loadProcurement();
    };
  })();
</script>

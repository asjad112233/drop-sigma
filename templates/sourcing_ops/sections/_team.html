<!-- ════════════════════════════════════════════════════════════════
     TEAM section — Drop Sigma specialists directory
═══════════════════════════════════════════════════════════════════ -->
<div id="opsTeamRoot" data-ready="0">
  <div class="ops-loading">Loading team…</div>
</div>

<style>
  /* ───── Filter toolbar ───── */
  #opsTeamRoot .tm-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:#fff;border:1px solid var(--ops-border);border-radius:16px;
    padding:12px 14px;margin-bottom:14px;
    box-shadow:0 1px 0 rgba(15,23,42,.02),0 8px 22px -18px rgba(15,23,42,.18);
  }
  #opsTeamRoot .tm-label{
    font-size:10.5px;font-weight:800;color:var(--ops-text-2);
    text-transform:uppercase;letter-spacing:.07em;margin-right:2px;
  }
  #opsTeamRoot .tm-chips{display:flex;flex-wrap:wrap;gap:6px;}
  #opsTeamRoot .tm-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:999px;
    font-size:11.5px;font-weight:700;color:var(--ops-text-2);
    background:#f1f5f9;border:1px solid transparent;cursor:pointer;
    transition:all .12s ease;line-height:1.1;
  }
  #opsTeamRoot .tm-chip:hover{background:#e2e8f0;color:var(--ops-text);}
  #opsTeamRoot .tm-chip.active{
    background:linear-gradient(135deg,#6366f1 0%,#a855f7 100%);
    color:#fff;border-color:rgba(99,102,241,.5);
    box-shadow:0 4px 12px rgba(99,102,241,.32);
  }
  #opsTeamRoot .tm-chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  #opsTeamRoot .tm-spacer{flex:1;}

  /* ───── Grid + cards ───── */
  #opsTeamRoot .tm-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;
  }
  #opsTeamRoot .tm-card{
    position:relative;background:#fff;border:1px solid var(--ops-border);
    border-radius:18px;padding:16px 16px 14px;cursor:pointer;
    transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
    box-shadow:0 1px 0 rgba(15,23,42,.02),0 10px 28px -22px rgba(15,23,42,.22);
    overflow:hidden;
  }
  #opsTeamRoot .tm-card:hover{
    transform:translateY(-2px);
    box-shadow:0 1px 0 rgba(15,23,42,.02),0 18px 38px -22px rgba(15,23,42,.32);
    border-color:rgba(99,102,241,.35);
  }
  #opsTeamRoot .tm-card::before{
    content:"";position:absolute;left:0;top:0;width:100%;height:3px;
    background:var(--role-color,#6366f1);opacity:.85;
  }
  #opsTeamRoot .tm-head{display:flex;align-items:center;gap:12px;}
  #opsTeamRoot .tm-av{
    width:54px;height:54px;border-radius:14px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;line-height:1;color:#fff;font-weight:900;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px -8px rgba(15,23,42,.4);
  }
  #opsTeamRoot .tm-meta{min-width:0;flex:1;}
  #opsTeamRoot .tm-name{
    display:flex;align-items:center;gap:6px;
    font-size:15.5px;font-weight:900;color:var(--ops-text);letter-spacing:-.01em;
    line-height:1.2;
  }
  #opsTeamRoot .tm-name .star{color:#d4af37;font-size:12px;}
  #opsTeamRoot .tm-title{
    font-size:11.5px;font-weight:600;color:var(--ops-text-2);
    margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  #opsTeamRoot .tm-role-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 8px;border-radius:999px;
    font-size:10px;font-weight:800;color:#fff;
    margin-top:6px;letter-spacing:.02em;
  }
  #opsTeamRoot .tm-status{
    position:absolute;top:14px;right:14px;
    display:flex;align-items:center;gap:5px;
    font-size:10px;font-weight:800;color:var(--ops-text-2);
    text-transform:uppercase;letter-spacing:.05em;
  }
  #opsTeamRoot .tm-status .dot{
    width:8px;height:8px;border-radius:50%;
    box-shadow:0 0 0 3px rgba(255,255,255,1),0 0 0 4px var(--dot,#94a3b8);
  }
  #opsTeamRoot .tm-status.active .dot{background:var(--ops-green);--dot:rgba(16,185,129,.35);}
  #opsTeamRoot .tm-status.away   .dot{background:var(--ops-amber);--dot:rgba(245,158,11,.35);}
  #opsTeamRoot .tm-status.offline .dot{background:#94a3b8;--dot:rgba(148,163,184,.35);}
  #opsTeamRoot .tm-status.inactive .dot{background:var(--ops-red);--dot:rgba(239,68,68,.35);}

  #opsTeamRoot .tm-stats{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    background:#f8fafc;border-radius:12px;padding:10px;margin-top:12px;
    border:1px solid rgba(15,23,42,.04);
  }
  #opsTeamRoot .tm-stat{text-align:center;}
  #opsTeamRoot .tm-stat .v{
    font-size:14px;font-weight:900;color:var(--ops-text);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  #opsTeamRoot .tm-stat .l{
    font-size:9.5px;font-weight:800;color:var(--ops-muted);
    text-transform:uppercase;letter-spacing:.06em;margin-top:1px;
  }
  #opsTeamRoot .tm-langs{
    display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;
  }
  #opsTeamRoot .tm-lang{
    font-size:10px;font-weight:700;
    background:#eef2ff;color:#4338ca;
    padding:2px 7px;border-radius:999px;letter-spacing:.02em;
  }

  /* ───── Modal ───── */
  #opsTeamRoot .tm-modal-back{
    position:fixed;inset:0;background:rgba(10,11,22,.55);
    display:flex;align-items:flex-start;justify-content:center;
    z-index:120;padding:48px 16px 28px;overflow-y:auto;
    backdrop-filter:blur(6px);
    animation:tmFade .18s ease both;
  }
  @keyframes tmFade{from{opacity:0;}to{opacity:1;}}
  #opsTeamRoot .tm-modal{
    background:#fff;border-radius:22px;max-width:620px;width:100%;
    box-shadow:0 30px 80px -20px rgba(10,11,22,.55);
    overflow:hidden;animation:tmRise .22s ease both;
  }
  @keyframes tmRise{from{transform:translateY(14px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  #opsTeamRoot .tm-modal-head{
    padding:18px 22px;border-bottom:1px solid var(--ops-border);
    display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg,rgba(99,102,241,.06),rgba(212,175,55,.04));
  }
  #opsTeamRoot .tm-modal-head .av{
    width:48px;height:48px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;color:#fff;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25);
  }
  #opsTeamRoot .tm-modal-head .ttl{font-size:16px;font-weight:900;color:var(--ops-text);}
  #opsTeamRoot .tm-modal-head .sub{font-size:11.5px;color:var(--ops-text-2);font-weight:600;}
  #opsTeamRoot .tm-modal-close{
    margin-left:auto;background:transparent;border:none;
    width:30px;height:30px;border-radius:8px;font-size:18px;color:#64748b;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  #opsTeamRoot .tm-modal-close:hover{background:rgba(15,23,42,.06);color:var(--ops-text);}
  #opsTeamRoot .tm-modal-body{padding:20px 22px;}
  #opsTeamRoot .tm-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  #opsTeamRoot .tm-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  #opsTeamRoot .tm-field{display:flex;flex-direction:column;gap:5px;}
  #opsTeamRoot .tm-field.full{grid-column:1/-1;}
  #opsTeamRoot .tm-field label{
    font-size:10.5px;font-weight:800;color:var(--ops-text-2);
    text-transform:uppercase;letter-spacing:.06em;
  }
  #opsTeamRoot .tm-field input,
  #opsTeamRoot .tm-field select,
  #opsTeamRoot .tm-field textarea{
    width:100%;padding:9px 11px;border-radius:10px;border:1px solid #e5e7eb;
    font-size:13px;font-weight:600;color:var(--ops-text);
    background:#fff;transition:border-color .12s,box-shadow .12s;
    font-family:inherit;
  }
  #opsTeamRoot .tm-field input:focus,
  #opsTeamRoot .tm-field select:focus,
  #opsTeamRoot .tm-field textarea:focus{
    outline:none;border-color:var(--ops-violet);
    box-shadow:0 0 0 3px rgba(99,102,241,.16);
  }
  #opsTeamRoot .tm-field input[type=color]{
    height:38px;padding:3px;cursor:pointer;
  }
  #opsTeamRoot .tm-toggles{
    display:flex;flex-wrap:wrap;gap:8px;
    background:#f8fafc;border:1px solid rgba(15,23,42,.05);
    padding:10px;border-radius:12px;
  }
  #opsTeamRoot .tm-toggle{
    display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    color:var(--ops-text);cursor:pointer;user-select:none;
    padding:6px 10px;border-radius:8px;
  }
  #opsTeamRoot .tm-toggle input{accent-color:var(--ops-violet);}
  #opsTeamRoot .tm-modal-foot{
    padding:14px 22px;border-top:1px solid var(--ops-border);
    background:#fafbff;display:flex;justify-content:flex-end;gap:8px;
  }
  #opsTeamRoot .tm-foot-msg{
    flex:1;font-size:12px;font-weight:700;color:var(--ops-red);
    display:flex;align-items:center;
  }

  /* ───── Tenant-facing profile subsection ───── */
  #opsTeamRoot .tm-section-divider{
    margin-top:14px;padding-top:14px;
    border-top:1px dashed rgba(15,23,42,.1);
    position:relative;
  }
  #opsTeamRoot .tm-section-divider::before{
    content:"";position:absolute;left:0;top:14px;width:4px;height:14px;border-radius:3px;
    background:linear-gradient(180deg,var(--ops-gold) 0%,var(--ops-gold-2) 50%,var(--ops-violet) 100%);
    box-shadow:0 0 10px rgba(244,196,48,.45);
  }
  #opsTeamRoot .tm-section-label{
    padding-left:12px;
    font-size:11.5px;font-weight:900;color:var(--ops-text);
    text-transform:uppercase;letter-spacing:.08em;
  }
  #opsTeamRoot .tm-section-hint{
    padding-left:12px;margin-top:3px;
    font-size:11px;font-weight:600;color:var(--ops-text-2);
    text-transform:none;letter-spacing:normal;
  }
  #opsTeamRoot .tm-hint{
    font-weight:600;color:var(--ops-muted);text-transform:none;
    letter-spacing:normal;font-size:10.5px;
  }
  #opsTeamRoot .tm-field textarea{resize:vertical;min-height:64px;}

  /* ───── Loading / empty ───── */
  #opsTeamRoot .tm-empty{
    text-align:center;padding:60px 20px;color:#64748b;
    background:#fff;border-radius:18px;border:1px dashed rgba(15,23,42,.1);
  }
  #opsTeamRoot .tm-empty .ic{font-size:42px;margin-bottom:10px;}
</style>

<script>
  (function(){
    /* ────── State ────── */
    const TS = {
      members: [],
      roles: [],
      filterRole: 'all',
      filterStatus: 'all',
    };

    /* ────── Loader (exposed to shell) ────── */
    window.opsLoadTeam = async function(){
      const root = document.getElementById('opsTeamRoot');
      if (root.dataset.ready === '0'){
        root.innerHTML = '<div class="ops-loading">Loading team…</div>';
        await tsFetchRoles();
      }
      await tsFetchMembers();
      tsRender();
      tsRenderActions();
      root.dataset.ready = '1';

      // If something called us with a pending member to open / focus
      // (e.g. clicking a team member name in the order queue), do it now.
      if (window.__opsPendingTeamOpen){
        const target = window.__opsPendingTeamOpen;
        window.__opsPendingTeamOpen = null;
        const m = TS.members.find(x =>
          (target.id && x.id === Number(target.id)) ||
          (target.name && (x.display_name||x.username||'').toLowerCase() === String(target.name).toLowerCase())
        );
        if (m){
          tsOpenMember(m);
          // Also flash the card briefly so user sees where it is
          setTimeout(() => {
            const card = root.querySelector(`.tm-card[data-id="${m.id}"]`);
            if (card){
              card.scrollIntoView({behavior:'smooth', block:'center'});
              card.style.transition = 'box-shadow .4s';
              card.style.boxShadow = '0 0 0 4px rgba(168,85,247,.4)';
              setTimeout(() => { card.style.boxShadow = ''; }, 1600);
            }
          }, 100);
        }
      }
    };

    /* ────── Public API: jump to + open a team member from anywhere ────── */
    window.opsOpenTeamMember = function(opts){
      // opts: { id? } or { name? }
      const target = (typeof opts === 'object') ? opts : { name: String(opts||'') };
      if (!target.id && !target.name) return;
      // If team section is already loaded, open directly
      if (document.getElementById('ops-section-team')
          && document.getElementById('ops-section-team').classList.contains('active')
          && TS.members.length){
        const m = TS.members.find(x =>
          (target.id && x.id === Number(target.id)) ||
          (target.name && (x.display_name||x.username||'').toLowerCase() === String(target.name).toLowerCase())
        );
        if (m){ tsOpenMember(m); return; }
      }
      // Otherwise switch view and let the loader pick it up
      window.__opsPendingTeamOpen = target;
      if (typeof opsSwitchView === 'function') opsSwitchView('team');
    };

    /* ────── Topbar actions ────── */
    function tsRenderActions(){
      const a = document.getElementById('opsSectionActions');
      if (!a) return;
      a.innerHTML = `
        <button class="ops-btn ghost" onclick="window.opsLoadTeam()">↻ Refresh</button>
        <button class="ops-btn primary" id="opsTeamInviteBtn">+ Invite Specialist</button>
      `;
      document.getElementById('opsTeamInviteBtn').onclick = tsOpenInvite;
    }

    /* ────── Fetchers ────── */
    async function tsFetchRoles(){
      const r = await opsFetch('/ops/api/roles/');
      if (r.ok){ TS.roles = r.data.roles || []; }
    }
    async function tsFetchMembers(){
      const r = await opsFetch('/ops/api/team/');
      if (r.ok){ TS.members = r.data.members || []; }
      else { TS.members = []; }
    }

    /* ────── Helpers ────── */
    function tsFiltered(){
      return TS.members.filter(m => {
        if (TS.filterRole !== 'all'){
          const role = TS.roles.find(r => r.id === m.role_id);
          if (!role || role.slug !== TS.filterRole) return false;
        }
        if (TS.filterStatus !== 'all' && m.status !== TS.filterStatus) return false;
        return true;
      });
    }

    function tsStatusLabel(s){
      return ({active:'Active',away:'Away',offline:'Offline',inactive:'Inactive'})[s] || s;
    }

    /* ────── Render ────── */
    function tsRender(){
      const root = document.getElementById('opsTeamRoot');
      const filtered = tsFiltered();
      const roleChips = ['all', ...TS.roles.map(r => r.slug)];
      const statusChips = ['all','active','away','offline','inactive'];

      const html = `
        <div class="tm-toolbar">
          <span class="tm-label">Role</span>
          <div class="tm-chips" id="tmRoleChips">
            ${roleChips.map(slug => {
              const r = slug === 'all' ? null : TS.roles.find(x => x.slug === slug);
              const lbl = slug === 'all' ? 'All' : (r ? r.name : slug);
              const col = (r && r.color) || '#6366f1';
              return `<button class="tm-chip ${TS.filterRole===slug?'active':''}"
                       data-role="${opsEsc(slug)}"
                       style="${TS.filterRole!==slug?`color:${opsEsc(col)};`:''}">
                       ${slug==='all'?'':'<span class="dot"></span>'}${opsEsc(lbl)}
                       ${r?` <span style="opacity:.65;font-weight:800;">${r.member_count}</span>`:''}
                     </button>`;
            }).join('')}
          </div>
          <span class="tm-label" style="margin-left:8px;">Status</span>
          <div class="tm-chips" id="tmStatusChips">
            ${statusChips.map(s => `
              <button class="tm-chip ${TS.filterStatus===s?'active':''}" data-status="${s}">
                ${s==='all'?'All':tsStatusLabel(s)}
              </button>`).join('')}
          </div>
          <span class="tm-spacer"></span>
          <span class="tm-label" style="margin-right:0;">${filtered.length} of ${TS.members.length}</span>
        </div>
        ${ filtered.length === 0
            ? `<div class="tm-empty"><div class="ic">👥</div><h3>No specialists match these filters</h3><p>Adjust the role or status filter, or invite a new specialist.</p></div>`
            : `<div class="tm-grid">${filtered.map(tsCardHtml).join('')}</div>` }
      `;
      root.innerHTML = html;

      // Wire chips
      root.querySelectorAll('#tmRoleChips .tm-chip').forEach(el => {
        el.onclick = () => { TS.filterRole = el.dataset.role; tsRender(); };
      });
      root.querySelectorAll('#tmStatusChips .tm-chip').forEach(el => {
        el.onclick = () => { TS.filterStatus = el.dataset.status; tsRender(); };
      });
      // Wire cards
      root.querySelectorAll('.tm-card').forEach(el => {
        el.onclick = () => {
          const id = Number(el.dataset.id);
          const m = TS.members.find(x => x.id === id);
          if (m) tsOpenMember(m);
        };
      });
    }

    function tsCardHtml(m){
      const stHandled = m.orders_handled != null ? m.orders_handled : 0;
      const stQuote   = m.avg_quote_hrs   != null ? Number(m.avg_quote_hrs).toFixed(1)+'h' : '—';
      const stOnTime  = m.on_time_pct     != null ? m.on_time_pct+'%' : '—';
      const langs = (m.languages || []).slice(0,4);
      const roleCol = m.role_color || '#6366f1';
      return `
        <div class="tm-card" data-id="${m.id}" style="--role-color:${opsEsc(roleCol)};">
          <div class="tm-status ${opsEsc(m.status)}">
            <span class="dot"></span>${opsEsc(tsStatusLabel(m.status))}
          </div>
          <div class="tm-head">
            <div class="tm-av" style="background:${opsEsc(m.avatar_color || '#6366f1')};">
              ${opsEsc(m.avatar_emoji || '👤')}
            </div>
            <div class="tm-meta">
              <div class="tm-name">
                ${opsEsc(m.display_name)}
                ${m.is_manager ? '<span class="star" title="Manager">★</span>' : ''}
              </div>
              <div class="tm-title">${opsEsc(m.title || '—')}</div>
              ${m.role ? `<span class="tm-role-badge" style="background:${opsEsc(roleCol)};">${opsEsc(m.role)}</span>` : ''}
            </div>
          </div>
          <div class="tm-stats">
            <div class="tm-stat"><div class="v">${stHandled}</div><div class="l">Orders</div></div>
            <div class="tm-stat"><div class="v">${stQuote}</div><div class="l">Avg Quote</div></div>
            <div class="tm-stat"><div class="v">${stOnTime}</div><div class="l">On Time</div></div>
          </div>
          ${ langs.length ? `<div class="tm-langs">${langs.map(l=>`<span class="tm-lang">${opsEsc(l)}</span>`).join('')}</div>` : '' }
        </div>`;
    }

    /* ────── Modal: edit member ────── */
    function tsOpenMember(m){
      const back = document.createElement('div');
      back.className = 'tm-modal-back';
      const roleCol = m.role_color || '#6366f1';
      back.innerHTML = `
        <div class="tm-modal" onclick="event.stopPropagation();">
          <div class="tm-modal-head">
            <div class="av" style="background:${opsEsc(m.avatar_color || '#6366f1')};">${opsEsc(m.avatar_emoji || '👤')}</div>
            <div>
              <div class="ttl">${opsEsc(m.display_name)}</div>
              <div class="sub">@${opsEsc(m.username)} · ${opsEsc(m.email || 'no email')}</div>
            </div>
            <button class="tm-modal-close" data-close>×</button>
          </div>
          <div class="tm-modal-body">
            <div class="tm-grid-2">
              <div class="tm-field full"><label>Display name</label><input id="fDisplay" type="text" value="${opsEsc(m.display_name)}"></div>
              <div class="tm-field"><label>Role</label>
                <select id="fRole">
                  <option value="">— No role —</option>
                  ${TS.roles.map(r => `<option value="${r.id}" ${m.role_id===r.id?'selected':''}>${opsEsc(r.name)}</option>`).join('')}
                </select>
              </div>
              <div class="tm-field"><label>Title</label><input id="fTitle" type="text" value="${opsEsc(m.title)}"></div>
              <div class="tm-field"><label>Status</label>
                <select id="fStatus">
                  ${['active','away','offline','inactive'].map(s => `<option value="${s}" ${m.status===s?'selected':''}>${tsStatusLabel(s)}</option>`).join('')}
                </select>
              </div>
              <div class="tm-field"><label>Timezone</label>
                <select id="fTz">
                  ${tsTimezoneOptions(m.timezone)}
                </select>
              </div>
              <div class="tm-grid-3" style="grid-column:1/-1;">
                <div class="tm-field"><label>Emoji</label><input id="fEmoji" type="text" maxlength="2" value="${opsEsc(m.avatar_emoji || '👤')}"></div>
                <div class="tm-field"><label>Avatar color</label><input id="fColor" type="color" value="${opsEsc(m.avatar_color || '#6366f1')}"></div>
                <div class="tm-field"><label>Email</label><input id="fEmail" type="email" value="${opsEsc(m.email)}"></div>
              </div>
              <div class="tm-field full"><label>Languages (comma-separated)</label>
                <input id="fLangs" type="text" value="${opsEsc((m.languages || []).join(', '))}">
              </div>
              <div class="tm-field full">
                <label>Permissions</label>
                <div class="tm-toggles">
                  <label class="tm-toggle"><input type="checkbox" id="fIsManager" ${m.is_manager?'checked':''}> Manager</label>
                  <label class="tm-toggle"><input type="checkbox" id="fCanAssign" ${m.can_assign?'checked':''}> Can assign orders</label>
                  <label class="tm-toggle"><input type="checkbox" id="fCanQuote" ${m.can_quote?'checked':''}> Can send quotes</label>
                </div>
              </div>

              <div class="tm-field full tm-section-divider">
                <div class="tm-section-label">Tenant-facing profile</div>
                <div class="tm-section-hint">How you appear to assigned tenants in chat — bio, headshot, signature, specialties.</div>
              </div>
              <div class="tm-field full">
                <label>Bio <span class="tm-hint">— shown on the tenant chat header (~200 chars)</span></label>
                <textarea id="fBio" name="bio" rows="3" maxlength="500" placeholder="10 years sourcing apparel and beauty from Asia. Specializes in fast-turnaround orders.">${opsEsc(m.bio || '')}</textarea>
              </div>
              <div class="tm-field full">
                <label>Photo URL <span class="tm-hint">— headshot for tenant chat (square crop recommended)</span></label>
                <input id="fPhotoUrl" name="photo_url" type="url" value="${opsEsc(m.photo_url || '')}" placeholder="https://…">
              </div>
              <div class="tm-field full">
                <label>Specialties <span class="tm-hint">— comma-separated</span></label>
                <input id="fSpecialties" name="specialties_text" type="text" value="${opsEsc(Array.isArray(m.specialties) ? m.specialties.join(', ') : (m.specialties_text || m.specialties || ''))}" placeholder="Apparel, Beauty, Home goods">
              </div>
              <div class="tm-field full">
                <label>Signature <span class="tm-hint">— short line shown after your messages</span></label>
                <input id="fSignature" name="signature" type="text" maxlength="160" value="${opsEsc(m.signature || '')}" placeholder="Sara · Drop Sigma Sourcing">
              </div>
              <div class="tm-field">
                <label>Typical reply (minutes)</label>
                <input id="fTypicalReply" name="typical_reply_min" type="number" min="1" max="180" value="${Number(m.typical_reply_min) > 0 ? Number(m.typical_reply_min) : 5}">
              </div>
              <div class="tm-field">
                <label>Auto-assignable</label>
                <div class="tm-toggles" style="margin-top:0;">
                  <label class="tm-toggle"><input type="checkbox" id="fCustomerFacing" ${(m.customer_facing===undefined?true:m.customer_facing)?'checked':''}> Can be auto-assigned to tenants</label>
                </div>
              </div>
            </div>
          </div>
          <div class="tm-modal-foot">
            <div class="tm-foot-msg" id="fMsg"></div>
            <button class="ops-btn ghost" data-close>Cancel</button>
            <button class="ops-btn primary" id="fSave">Save changes</button>
          </div>
        </div>`;
      back.onclick = () => back.remove();
      back.querySelectorAll('[data-close]').forEach(b => b.onclick = () => back.remove());
      document.body.appendChild(back);

      back.querySelector('#fSave').onclick = async () => {
        const msg = back.querySelector('#fMsg'); msg.textContent = '';
        const payload = {
          display_name: back.querySelector('#fDisplay').value.trim(),
          role_id:      back.querySelector('#fRole').value || null,
          title:        back.querySelector('#fTitle').value.trim(),
          status:       back.querySelector('#fStatus').value,
          timezone:     back.querySelector('#fTz').value,
          avatar_emoji: back.querySelector('#fEmoji').value.trim() || '👤',
          avatar_color: back.querySelector('#fColor').value,
          email:        back.querySelector('#fEmail').value.trim(),
          languages:    back.querySelector('#fLangs').value,
          is_manager:   back.querySelector('#fIsManager').checked,
          can_assign:   back.querySelector('#fCanAssign').checked,
          can_quote:    back.querySelector('#fCanQuote').checked,
          // ─ Tenant-facing profile fields ─
          bio:               back.querySelector('#fBio').value.trim(),
          photo_url:         back.querySelector('#fPhotoUrl').value.trim(),
          specialties_text:  back.querySelector('#fSpecialties').value,
          signature:         back.querySelector('#fSignature').value.trim(),
          typical_reply_min: Math.max(1, Math.min(180, parseInt(back.querySelector('#fTypicalReply').value, 10) || 5)),
          customer_facing:   back.querySelector('#fCustomerFacing').checked,
        };
        const btn = back.querySelector('#fSave');
        btn.disabled = true; btn.textContent = 'Saving…';
        const r = await opsFetch(`/ops/api/team/${m.id}/update/`, { method:'POST', body: payload });
        btn.disabled = false; btn.textContent = 'Save changes';
        if (r.ok){
          opsToast('Specialist updated', 'success');
          back.remove();
          await window.opsLoadTeam();
        } else {
          msg.textContent = (r.data && r.data.error) || 'Could not save changes.';
        }
      };
    }

    /* ────── Modal: invite ────── */
    function tsOpenInvite(){
      const back = document.createElement('div');
      back.className = 'tm-modal-back';
      back.innerHTML = `
        <div class="tm-modal" onclick="event.stopPropagation();">
          <div class="tm-modal-head">
            <div class="av" style="background:linear-gradient(135deg,#d4af37,#a855f7);">✦</div>
            <div>
              <div class="ttl">Invite a specialist</div>
              <div class="sub">Adds them to DropSigmaOps and creates their profile.</div>
            </div>
            <button class="tm-modal-close" data-close>×</button>
          </div>
          <div class="tm-modal-body">
            <div class="tm-grid-2">
              <div class="tm-field"><label>Username *</label><input id="iUser" type="text" placeholder="e.g. amir"></div>
              <div class="tm-field"><label>Email</label><input id="iEmail" type="email" placeholder="amir@dropsigma.com"></div>
              <div class="tm-field full"><label>Display name</label><input id="iDisplay" type="text" placeholder="Amir Tariq"></div>
              <div class="tm-field"><label>Role</label>
                <select id="iRole">
                  <option value="">— Pick a role —</option>
                  ${TS.roles.map(r => `<option value="${r.id}">${opsEsc(r.name)}</option>`).join('')}
                </select>
              </div>
              <div class="tm-field"><label>Title</label><input id="iTitle" type="text" placeholder="Sourcing Specialist"></div>
              <div class="tm-field"><label>Status</label>
                <select id="iStatus">
                  <option value="active" selected>Active</option>
                  <option value="away">Away</option>
                  <option value="offline">Offline</option>
                  <option value="inactive">Inactive</option>
                </select>
              </div>
              <div class="tm-field"><label>Timezone</label>
                <select id="iTz">${tsTimezoneOptions('Asia/Karachi')}</select>
              </div>
              <div class="tm-grid-3" style="grid-column:1/-1;">
                <div class="tm-field"><label>Emoji</label><input id="iEmoji" type="text" maxlength="2" value="👤"></div>
                <div class="tm-field"><label>Avatar color</label><input id="iColor" type="color" value="#6366f1"></div>
                <div class="tm-field"><label>Initial password</label><input id="iPass" type="text" value="dropsigma123"></div>
              </div>
              <div class="tm-field full"><label>Languages (comma-separated)</label>
                <input id="iLangs" type="text" placeholder="English, Urdu, Mandarin">
              </div>
              <div class="tm-field full">
                <label>Permissions</label>
                <div class="tm-toggles">
                  <label class="tm-toggle"><input type="checkbox" id="iIsManager"> Manager</label>
                  <label class="tm-toggle"><input type="checkbox" id="iCanAssign" checked> Can assign orders</label>
                  <label class="tm-toggle"><input type="checkbox" id="iCanQuote" checked> Can send quotes</label>
                </div>
              </div>

              <div class="tm-field full tm-section-divider">
                <div class="tm-section-label">Tenant-facing profile</div>
                <div class="tm-section-hint">Optional — bio, headshot, signature, and specialties shown to assigned tenants.</div>
              </div>
              <div class="tm-field full">
                <label>Bio <span class="tm-hint">— shown on the tenant chat header (~200 chars)</span></label>
                <textarea id="iBio" name="bio" rows="3" maxlength="500" placeholder="10 years sourcing apparel and beauty from Asia."></textarea>
              </div>
              <div class="tm-field full">
                <label>Photo URL <span class="tm-hint">— headshot for tenant chat</span></label>
                <input id="iPhotoUrl" name="photo_url" type="url" placeholder="https://…">
              </div>
              <div class="tm-field full">
                <label>Specialties <span class="tm-hint">— comma-separated</span></label>
                <input id="iSpecialties" name="specialties_text" type="text" placeholder="Apparel, Beauty, Home goods">
              </div>
              <div class="tm-field full">
                <label>Signature <span class="tm-hint">— short line shown after messages</span></label>
                <input id="iSignature" name="signature" type="text" maxlength="160" placeholder="Sara · Drop Sigma Sourcing">
              </div>
              <div class="tm-field">
                <label>Typical reply (minutes)</label>
                <input id="iTypicalReply" name="typical_reply_min" type="number" min="1" max="180" value="5">
              </div>
              <div class="tm-field">
                <label>Auto-assignable</label>
                <div class="tm-toggles" style="margin-top:0;">
                  <label class="tm-toggle"><input type="checkbox" id="iCustomerFacing" checked> Can be auto-assigned to tenants</label>
                </div>
              </div>
            </div>
          </div>
          <div class="tm-modal-foot">
            <div class="tm-foot-msg" id="iMsg"></div>
            <button class="ops-btn ghost" data-close>Cancel</button>
            <button class="ops-btn primary" id="iCreate">Send invite</button>
          </div>
        </div>`;
      back.onclick = () => back.remove();
      back.querySelectorAll('[data-close]').forEach(b => b.onclick = () => back.remove());
      document.body.appendChild(back);

      const userInput = back.querySelector('#iUser');
      const msg = back.querySelector('#iMsg');
      userInput.addEventListener('blur', () => {
        const v = userInput.value.trim().toLowerCase();
        if (!v) return;
        if (TS.members.some(m => (m.username || '').toLowerCase() === v)){
          msg.textContent = `Username "${v}" is already taken.`;
        } else {
          msg.textContent = '';
        }
      });

      back.querySelector('#iCreate').onclick = async () => {
        msg.textContent = '';
        const payload = {
          username:     back.querySelector('#iUser').value.trim(),
          email:        back.querySelector('#iEmail').value.trim(),
          display_name: back.querySelector('#iDisplay').value.trim(),
          role_id:      back.querySelector('#iRole').value || null,
          title:        back.querySelector('#iTitle').value.trim(),
          status:       back.querySelector('#iStatus').value,
          timezone:     back.querySelector('#iTz').value,
          avatar_emoji: back.querySelector('#iEmoji').value.trim() || '👤',
          avatar_color: back.querySelector('#iColor').value,
          password:     back.querySelector('#iPass').value || 'dropsigma123',
          languages:    back.querySelector('#iLangs').value,
          is_manager:   back.querySelector('#iIsManager').checked,
          can_assign:   back.querySelector('#iCanAssign').checked,
          can_quote:    back.querySelector('#iCanQuote').checked,
          // ─ Tenant-facing profile fields ─
          bio:               back.querySelector('#iBio').value.trim(),
          photo_url:         back.querySelector('#iPhotoUrl').value.trim(),
          specialties_text:  back.querySelector('#iSpecialties').value,
          signature:         back.querySelector('#iSignature').value.trim(),
          typical_reply_min: Math.max(1, Math.min(180, parseInt(back.querySelector('#iTypicalReply').value, 10) || 5)),
          customer_facing:   back.querySelector('#iCustomerFacing').checked,
        };
        if (!payload.username){ msg.textContent = 'Username is required.'; return; }
        const btn = back.querySelector('#iCreate');
        btn.disabled = true; btn.textContent = 'Creating…';
        const r = await opsFetch('/ops/api/team/create/', { method:'POST', body: payload });
        btn.disabled = false; btn.textContent = 'Send invite';
        if (r.ok){
          opsToast('Specialist added to the team', 'success');
          back.remove();
          await window.opsLoadTeam();
        } else {
          msg.textContent = (r.data && r.data.error) || 'Could not create specialist.';
        }
      };
    }

    function tsTimezoneOptions(current){
      const tzs = [
        'Asia/Karachi','Asia/Shanghai','Asia/Hong_Kong','Asia/Tokyo','Asia/Dubai',
        'Asia/Kolkata','Asia/Singapore','Europe/London','Europe/Berlin',
        'America/New_York','America/Los_Angeles','UTC',
      ];
      if (current && !tzs.includes(current)) tzs.unshift(current);
      return tzs.map(z => `<option value="${z}" ${z===current?'selected':''}>${z}</option>`).join('');
    }
  })();
</script>

     Click → opens the order detail modal (window.opsOpenOrderModal). -->

  #opsQueueRoot .oq-chip.active{

  #opsQueueRoot .oq-chip.active .ct{background:rgba(244,196,48,.25);color:#f4c430;}

  /* Order row card — two-tier (strip + body) to match the tenant-side

  #opsQueueRoot .oq-list{display:flex;flex-direction:column;gap:10px;}
  #opsQueueRoot .oq-row{
    display:flex;flex-direction:column;
    background:#fff;border:1px solid rgba(15,23,42,.18);border-radius:14px;

    transition:box-shadow .15s,transform .15s,border-color .15s;

  #opsQueueRoot .oq-row:hover{

  }
  #opsQueueRoot .oq-row.is-checked{
    border-color:#a855f7;box-shadow:0 0 0 1px #a855f7,0 12px 28px -20px rgba(168,85,247,.4);
  }

  /* TOP STRIP — order meta */
  #opsQueueRoot .oq-strip{
    display:flex;align-items:center;justify-content:flex-start;

  #opsQueueRoot .oq-check{width:15px;height:15px;cursor:pointer;accent-color:#d4af37;flex-shrink:0;}
  #opsQueueRoot .oq-plat-badge{
    display:inline-flex;align-items:center;justify-content:center;

    font-size:11px;font-weight:900;line-height:1;flex-shrink:0;
    font-family:"SF Pro Display","Inter",ui-sans-serif,system-ui,sans-serif;

  #opsQueueRoot .oq-plat-badge.shopify{

  #opsQueueRoot .oq-plat-badge.woocommerce{
    background:linear-gradient(135deg,#9b6dc4,#7f54b3);color:#fff;

  #opsQueueRoot .oq-plat-badge.other{background:#f1f5f9;color:#475569;border:1px solid #e5e7eb;}

  #opsQueueRoot .oq-pill-grp-processing{background:linear-gradient(135deg,#dbeafe,#93c5fd);color:#1e40af;}
  #opsQueueRoot .oq-pill-grp-shipping{background:linear-gradient(135deg,#cffafe,#a5f3fc);color:#155e75;}
  #opsQueueRoot .oq-pill-grp-delivered{background:linear-gradient(135deg,#d1fae5,#6ee7b7);color:#065f46;}
  #opsQueueRoot .oq-pill-grp-cancel{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#991b1b;}

  /* Country flag (next to customer in strip) */
  #opsQueueRoot .oq-flag{display:inline-block;font-size:14px;margin-left:2px;vertical-align:-1px;}

  /* BODY — product · customer · supplier · assignee · actions */
  #opsQueueRoot .oq-body{
    display:flex;flex-wrap:nowrap;align-items:center;gap:12px;
    width:100%;box-sizing:border-box;padding:12px 16px;
  }
  /* Vertical column dividers — applied to customer, supplier, price, assignee, actions */
  #opsQueueRoot .oq-body > .oq-cust,
  #opsQueueRoot .oq-body > .oq-supplier,
  #opsQueueRoot .oq-body > .oq-price-col,
  #opsQueueRoot .oq-body > .oq-assignee,

  #opsQueueRoot .oq-row-price .line.sells{

  #opsQueueRoot .oq-row-price .line.sells .l{

  #opsQueueRoot .oq-row-price .line.sells .v{

  /* Currency badge next to "Tenant Sells" — small uppercase pill so the

    font-size:8.5px;font-weight:800;letter-spacing:.06em;
    padding:1.5px 5px;border-radius:4px;
    background:rgba(16,185,129,.15);color:#047857;

  #opsQueueRoot .oq-row-price .line.is-total{

  #opsQueueRoot .oq-row-price .line.is-total .l{
    font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:9.5px;color:#7a5a00;

  #opsQueueRoot .oq-row-price .line.is-total .v{

  /* ⓘ info chip on the value side — purely a discoverability cue

  #opsQueueRoot .oq-row-price .line.margin .est-info{

  #opsQueueRoot .oq-price-pending{

<div id="opsQueueRoot">
  <div class="ops-loading">Loading Order Queue…</div>
</div>

<script>
(function(){
  /* ─── Module-level state ────────────────────────────────────────── */
  const OQ = {
    filters: {
      status: 'all',
      search: '',
      sort: 'newest',
      assigned: 'any',
    },
    orders: [],
    selected: new Set(),
    members: [],
    suppliers: [],
    rendering: false,
    debounce: null,
  };

  const STATUS_CHIPS = [
    {key:'all',             label:'All'},
    {key:'pending_source',  label:'Pending Source'},
    {key:'pending_payment', label:'Pending Payment'},
    {key:'processing',      label:'Processing'},
    {key:'shipping',        label:'Shipping'},
    {key:'delivered',       label:'Delivered'},
    {key:'cancel',          label:'Cancel'},
  ];

  const PLATFORM_BADGE = {
    shopify:     {ic:'🛍️', label:'Shopify',     cls:'shopify'},
    woocommerce: {ic:'W',  label:'WooCommerce', cls:'woocommerce'},
    woo:         {ic:'W',  label:'WooCommerce', cls:'woocommerce'},
  };

  /* Short date formatter for the strip (e.g. "Jun 5, 2026 · 10:08 PM") */
  function fmtShortDate(iso){
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleString('en-US', {
      month:'short', day:'numeric', year:'numeric',
      hour:'numeric', minute:'2-digit',
    }).replace(',', '');
  }

  /* ─── Public entry point — called by the shell ──────────────────── */
  window.opsLoadQueue = async function(){
    if (!document.getElementById('opsQueueRoot')) return;
    if (OQ.rendering) return;
    OQ.rendering = true;
    try {
      renderShell();
      await Promise.all([
        loadOrders(),
        loadMembersIfNeeded(),
      ]);
    } finally {
      OQ.rendering = false;
    }
  };

  /* ─── Side-loaders ──────────────────────────────────────────────── */
  async function loadMembersIfNeeded(){
    if (OQ.members.length) return;
    const r = await opsFetch('/ops/api/team/');
    if (r.ok && r.data && Array.isArray(r.data.members)) {
      OQ.members = r.data.members;
      const sel = document.getElementById('oqAssignedSel');
      if (sel) populateAssignedSelect(sel);
    }
  }

  function populateAssignedSelect(sel){
    sel.innerHTML = '';
    const opts = [
      ['any',        'Anyone'],
      ['unassigned', 'Unassigned'],
      ['me',         'Assigned to me'],
    ];
    for (const m of OQ.members){
      opts.push([String(m.id), m.display_name || m.username]);
    }
    sel.innerHTML = opts.map(([v,l]) =>
      `<option value="${opsEsc(v)}" ${OQ.filters.assigned===v?'selected':''}>${opsEsc(l)}</option>`
    ).join('');
  }

  async function loadOrders(){
    const list = document.getElementById('oqList');
    if (list) list.innerHTML =
      Array.from({length:5}).map(() => '<div class="oq-skel-row"></div>').join('');

    const qs = new URLSearchParams();
    if (OQ.filters.status && OQ.filters.status !== 'all') qs.set('status', OQ.filters.status);
    if (OQ.filters.search) qs.set('search', OQ.filters.search);
    if (OQ.filters.sort)   qs.set('sort', OQ.filters.sort);
    if (OQ.filters.assigned && OQ.filters.assigned !== 'any') qs.set('assigned', OQ.filters.assigned);

    const r = await opsFetch('/ops/api/orders/?' + qs.toString());
    if (!r.ok){
      if (list) list.innerHTML = '<div class="oq-empty"><div class="ic">⚠️</div><h3>Could not load orders</h3><p>Check console for details.</p></div>';
      return;
    }
    OQ.orders = (r.data && r.data.orders) || [];
    renderChipsCounts();
    renderList();
  }

  /* ─── Render: shell ─────────────────────────────────────────────── */
  function renderShell(){
    const root = document.getElementById('opsQueueRoot');
    if (!root) return;
    root.innerHTML = `
      <div class="oq-toolbar">
        <div class="oq-toolbar-row">
          <div class="oq-search">
            <span class="ic">🔎</span>
            <input id="oqSearch" type="search" placeholder="Search by customer, store, DS#, SKU, email…" autocomplete="off">
          </div>
          <select id="oqSort" class="oq-select">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="amount_desc">Highest amount</option>
            <option value="amount_asc">Lowest amount</option>
            <option value="customer">Customer A–Z</option>
          </select>
          <select id="oqAssignedSel" class="oq-select">
            <option value="any">Anyone</option>
            <option value="unassigned">Unassigned</option>
            <option value="me">Assigned to me</option>
          </select>
          <button class="ops-btn ghost" id="oqRefresh" title="Refresh">↻</button>
        </div>
        <div class="oq-toolbar-row">
          <div class="oq-chips" id="oqChips"></div>
        </div>
      </div>
      <div id="oqBulkBar"></div>
      <div class="oq-list" id="oqList"></div>
    `;

    // Status chips
    const chips = document.getElementById('oqChips');
    chips.innerHTML = STATUS_CHIPS.map(c => `
      <button class="oq-chip ${c.key===OQ.filters.status?'active':''}" data-status="${c.key}">
        <span>${opsEsc(c.label)}</span>
        <span class="ct" id="oqCt-${c.key}">0</span>
      </button>
    `).join('');
    chips.querySelectorAll('.oq-chip').forEach(el => {
      el.addEventListener('click', () => {
        OQ.filters.status = el.dataset.status;
        chips.querySelectorAll('.oq-chip').forEach(c =>
          c.classList.toggle('active', c.dataset.status === OQ.filters.status));
        loadOrders();
      });
    });

    // Search debounce
    const inp = document.getElementById('oqSearch');
    inp.value = OQ.filters.search;
    inp.addEventListener('input', e => {
      OQ.filters.search = e.target.value;
      clearTimeout(OQ.debounce);
      OQ.debounce = setTimeout(loadOrders, 350);
    });

    // Sort
    const sort = document.getElementById('oqSort');
    sort.value = OQ.filters.sort;
    sort.addEventListener('change', e => {
      OQ.filters.sort = e.target.value;
      loadOrders();
    });

    // Assigned
    const asg = document.getElementById('oqAssignedSel');
    populateAssignedSelect(asg);
    asg.addEventListener('change', e => {
      OQ.filters.assigned = e.target.value;
      loadOrders();
    });

    // Refresh
    document.getElementById('oqRefresh').addEventListener('click', () => loadOrders());
  }

  /* ─── Render: status counts ─────────────────────────────────────── */
  function renderChipsCounts(){
    const counts = {all: OQ.orders.length};
    for (const c of STATUS_CHIPS){ if (c.key !== 'all') counts[c.key] = 0; }
    for (const o of OQ.orders) counts[o.sourcing_status] = (counts[o.sourcing_status] || 0) + 1;
    for (const c of STATUS_CHIPS){
      const el = document.getElementById('oqCt-' + c.key);
      if (el) el.textContent = counts[c.key] || 0;
    }
  }

  /* ─── Render: list of orders ────────────────────────────────────── */
  function renderList(){
    const list = document.getElementById('oqList');
    if (!list) return;
    if (!OQ.orders.length){
      list.innerHTML = `
        <div class="oq-empty">
          <div class="ic">📭</div>
          <h3>No orders match your filters</h3>
          <p>Try clearing the search or selecting a different status chip.</p>
        </div>`;
      renderBulkBar();
      return;
    }
    list.innerHTML = OQ.orders.map(renderRow).join('');
    // wire row clicks (excluding inner controls and clickable cells)
    list.querySelectorAll('.oq-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('.oq-actions')
            || e.target.closest('.oq-check')
            || e.target.closest('.oq-supplier .tx')
            || e.target.closest('.oq-assignee .nm')) return;
        const id = Number(row.dataset.id);
        if (id && window.opsOpenOrderModal) window.opsOpenOrderModal(id);
      });
    });

    // Clickable supplier name → open supplier detail in Suppliers section
    list.querySelectorAll('.oq-supplier .tx[data-supplier-id]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = el.dataset.supplierId;
        if (!id) return;
        if (typeof window.opsOpenSupplierDetail === 'function'){
          window.opsOpenSupplierDetail(id);
        } else {
          opsToast('Suppliers section not ready — try again.', 'error');
        }
      });
    });

    // Clickable assignee name → open team member detail in Team section
    list.querySelectorAll('.oq-assignee:not(.unassigned) .nm').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        const nm = el.dataset.assigneeName || '';
        if (!nm) return;
        if (typeof window.opsOpenTeamMember === 'function'){
          window.opsOpenTeamMember({ name: nm });
        } else {
          opsToast('Team section not ready — try again.', 'error');
        }
      });
    });
    list.querySelectorAll('.oq-check').forEach(cb => {
      cb.addEventListener('change', e => {
        const id = Number(cb.dataset.id);
        const row = cb.closest('.oq-row');
        if (cb.checked) { OQ.selected.add(id); row.classList.add('is-checked'); }
        else { OQ.selected.delete(id); row.classList.remove('is-checked'); }
        renderBulkBar();
      });
    });
    list.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = Number(btn.dataset.id);
        const act = btn.dataset.action;
        handleRowAction(act, id);
      });
    });
    renderBulkBar();
  }

  function renderRow(o){
    const pf = PLATFORM_BADGE[(o.store_platform||'').toLowerCase()] || {ic:'🌐',label:'Other',cls:'other'};
    const img = o.product_image_url
      ? `<img src="${opsEsc(o.product_image_url)}" alt="" loading="lazy">`
      : `<div class="ph">📦</div>`;
    const supplierHtml = supplierColumn(o);
    const actionsHtml  = actionsForStatus(o);
    const checked = OQ.selected.has(o.id);

    // Strip pieces
    const createdShort = fmtShortDate(o.created_at_iso);
    const paidShort    = o.paid_at_iso ? fmtShortDate(o.paid_at_iso) : '';
    const tenantTag    = (o.store_name || o.tenant_username)
      ? `<span class="oq-strip-sep">·</span><span class="oq-strip-meta">🏪 ${opsEsc(o.store_name || ('@'+o.tenant_username))}</span>`
      : '';
    const flagHtml = o.flag ? ` <span class="oq-flag" title="${opsEsc(o.ship_country)}">${opsEsc(o.flag)}</span>` : '';

    // Body — product info
    const moreItems = (o.item_count > 1)
      ? `<div class="more">+${o.item_count - 1} more</div>` : '';

    // Assignee chip
    const assigneeBg = opsEsc(o.assignee_color || '#94a3b8');
    const assigneeName = o.assignee || 'Unassigned';
    const assigneeRole = o.assignee_role || '';
    const assigneeCls  = o.assignee ? '' : 'unassigned';

    return `
      <div class="oq-row ${checked?'is-checked':''}" data-id="${o.id}">
        <div class="oq-strip">
          <input type="checkbox" class="oq-check" data-id="${o.id}" ${checked?'checked':''} onclick="event.stopPropagation()">
          <span class="oq-plat-badge ${pf.cls}" title="Synced from ${opsEsc(pf.label)}">${pf.ic}</span>
          <span class="oq-strip-ref" title="Drop Sigma order #">${opsEsc(o.ds_order_ref || ('DS-'+o.id))}</span>
          <span class="oq-strip-sep">·</span>
          <span class="oq-strip-src" title="Customer's order #">#${opsEsc(o.source_order_ref || '—')}</span>
          <span class="oq-strip-sep">·</span>
          <span class="oq-strip-pill oq-pill-grp-${opsEsc(o.sourcing_status)}">${opsEsc(o.sourcing_status_label)}</span>
          ${tenantTag}
          ${createdShort ? `<span class="oq-strip-sep">·</span><span class="oq-strip-meta">📅 Created ${opsEsc(createdShort)}</span>` : ''}
          <span class="oq-strip-sep">·</span>
          <span class="oq-strip-meta oq-strip-customer">👤 ${opsEsc(o.customer_name || '—')}${flagHtml}</span>
          ${paidShort ? `<span class="oq-strip-paid">💳 Paid ${opsEsc(paidShort)}</span>` : ''}
        </div>
        <div class="oq-body">
          <div class="oq-product">
            ${img}
            <div class="info">
              <div class="nm">${opsEsc(o.product_name || '—')}</div>
              ${moreItems}
              <div class="meta">${o.product_sku ? opsEsc(o.product_sku) : '—'} · qty ${o.item_count > 1 ? (o.item_count + ' items') : '1'}</div>
            </div>
          </div>
          <div class="oq-cust">
            ${o.customer_phone ? `<div class="phone">📞 ${opsEsc(o.customer_phone)}</div>` : ''}
            ${o.customer_email ? `<div class="email" title="${opsEsc(o.customer_email)}">📧 ${opsEsc(o.customer_email)}</div>` : ''}
            <div class="city">${opsEsc([o.ship_city, o.ship_country].filter(Boolean).join(', ') || '—')}</div>
            <div class="tenant">${opsEsc(o.created_ago || '')}</div>
          </div>
          <div class="oq-supplier">${supplierHtml}</div>
          <div class="oq-price-col">${priceBlock(o)}</div>
          <div class="oq-assignee ${assigneeCls}">
            <div class="lbl">Assigned to</div>
            <span class="nm" data-assignee-name="${opsEsc(assigneeName)}"
                  title="${opsEsc(assigneeName)}${o.assignee?' — click to open team member':''}">${opsEsc(assigneeName)}</span>
            ${assigneeRole ? `<div class="role">${opsEsc(assigneeRole)}</div>` : '<div class="role" style="color:#cbd5e1;">—</div>'}
          </div>
          <div class="oq-actions">${actionsHtml}</div>
        </div>
      </div>
    `;
  }

  function supplierInitials(name){
    if (!name) return '?';
    const p = String(name).trim().split(/\s+/);
    return (((p[0]||'')[0]||'') + ((p[1]||'')[0]||'')).toUpperCase() || '?';
  }

  function supplierColumn(o){
    // Every state uses the same 3-row vertical rhythm (label + name + meta).
    if (o.supplier_name){
      const auto = o.supplier_auto_matched
        ? '<span class="auto" title="Auto-matched by SKU">⚡ Auto</span>' : '';
      const metaParts = [];
      if (o.supplier_flag || o.supplier_country){
        metaParts.push(`${opsEsc(o.supplier_flag||'')} ${opsEsc(o.supplier_country||'')}`.trim());
      }
      if (o.sourcing_lead_days){
        metaParts.push(`${o.sourcing_lead_days}d lead`);
      }
      const metaHtml = `<div class="meta">${
        metaParts.length
          ? metaParts.map((p,i)=>`<span>${p}</span>${i<metaParts.length-1?'<span class="sep">·</span>':''}`).join('')
          : '<span style="color:#cbd5e1;">—</span>'
      }</div>`;
      const supId = o.supplier_id || '';
      return `
        <div class="lbl">Sourced via</div>
        <div class="name">
          <span class="tx" data-supplier-id="${opsEsc(supId)}" data-supplier-name="${opsEsc(o.supplier_name)}"
                title="Click to open ${opsEsc(o.supplier_name)}">${opsEsc(o.supplier_name)}</span>
          ${auto}
        </div>
        ${metaHtml}
      `;
    }
    if (o.sourcing_status === 'pending_source'){
      return `
        <div class="lbl">Sourced via</div>
        <div class="name">
          <span class="tx awaiting">Awaiting source</span>
        </div>
        <div class="meta"><span style="color:#cbd5e1;">Pick supplier in Quote tab</span></div>
      `;
    }
    return `
      <div class="lbl">Sourced via</div>
      <div class="name">
        <span class="tx unlinked">Not linked</span>
      </div>
      <div class="meta"><span style="color:#cbd5e1;">Needs investigation</span></div>
    `;
  }

  /* Price block — Tenant Sells (top) + Product/Shipping/Drop-Sigma Total
     (middle) + Margin (bottom). Pending Source orders (no quote yet) only
     show the tenant-sells line + an "Awaiting quote" placeholder.

     CURRENCY RULE — Drop Sigma charges the tenant in USD across the
     board, but the tenant's merchant store can sell in any currency
     (AUD, EUR, GBP, …). The "Tenant Sells" amount comes through in
     the merchant's native currency, NOT USD, so subtracting it from
     the USD Drop-Sigma charge to compute margin would mix currencies.
     We therefore:
       (a) always print the merchant currency code next to the sells
           amount so an ops reader knows what unit they're looking at,
       (b) only render the Tenant Margin line when the merchant
           currency IS USD — otherwise the row shows "—" with a tooltip
           explaining we can't compute margin without an FX conversion.
     The day we have a live FX rate we can compute the margin for
     every currency; for now the explicit "—" is the honest answer.  */
  function priceBlock(o){
    const sells = Number(o.merchant_total_usd) || 0;
    const ccy   = (o.merchant_currency || 'USD').toUpperCase();
    const isUsd = ccy === 'USD';
    // For non-USD tenants we still pass the raw number to opsUSD (it
    // just formats with 2 decimals + thousands separators) and tack
    // the currency code on the end. opsUSD's "$" prefix is fine —
    // it's a generic money symbol; the suffix disambiguates.
    const sellsFmt = `${opsUSD(sells)} <span class="ccy">${opsEsc(ccy)}</span>`;
    const sellsLine = sells > 0
      ? `<span class="line sells"><span class="l">Tenant Sells</span><span class="v">${sellsFmt}</span></span>`
      : '';

    if (o.sourcing_status === 'pending_source' || !o.sourcing_total_usd){
      // No quote yet → just the tenant-sells line above a soft placeholder
      return `
        <div class="oq-row-price">
          ${sellsLine || ''}
          <span class="line"><span class="l" style="font-style:italic;color:#94a3b8;">Awaiting Drop Sigma quote…</span></span>
        </div>`;
    }

    const prod = o.sourcing_product_usd != null ? opsUSD(o.sourcing_product_usd) : '—';
    const ship = o.sourcing_shipping_usd != null ? opsUSD(o.sourcing_shipping_usd) : '—';
    const tot  = Number(o.sourcing_total_usd) || 0;

    // Margin policy:
    //   • USD tenants → exact margin in USD (sells - tot).
    //   • Non-USD tenants → if today's FX rate is available, convert
    //     the USD Drop-Sigma charge INTO the tenant's currency and
    //     compute the estimated margin IN THE TENANT'S CURRENCY (AUD
    //     / EUR / GBP / …). That's the unit the tenant actually
    //     thinks in — the ops reader sees the same figure their
    //     tenant will reconcile against in their books. Marked with
    //     a `~` prefix + ⓘ tooltip explaining the PSP / bank
    //     conversion at settlement will differ by a few %.
    //   • Non-USD tenants with no FX rate (Frankfurter down or
    //     unsupported currency) → "—" + tooltip.
    let marginLine = '';
    if (sells > 0){
      if (isUsd){
        const margin = sells - tot;
        const cls = margin >= 0 ? 'pos' : 'neg';
        const sign = margin >= 0 ? '+' : '−';
        marginLine = `<span class="line margin ${cls}"><span class="l">Tenant Margin</span><span class="v">${sign}${opsUSD(Math.abs(margin))}</span></span>`;
      } else {
        const rate   = Number(o.fx_rate_used);        // tenant_ccy per 1 USD
        const fxDate = o.fx_rate_date || '';
        if (rate > 0){
          // Convert Drop-Sigma's USD charge into the tenant's
          // currency, then subtract from what the tenant sold for
          // (already in that currency). Margin is therefore quoted
          // in the tenant's own unit. The "est." pill on the label
          // side already flags this as an estimate, so we DON'T also
          // prefix with "~" — one indicator, not two. Native title
          // tooltip sits on the WHOLE value span (not just the tiny
          // ⓘ glyph) so even a casual hover surfaces the FX detail.
          const totLocal = tot * rate;
          const margin   = sells - totLocal;
          const cls  = margin >= 0 ? 'pos' : 'neg';
          const sign = margin >= 0 ? '+' : '−';
          const tip  = `Estimated by converting Drop Sigma's USD charge ($${tot.toFixed(2)}) into ${ccy} at today's mid-market rate (1 USD = ${rate.toFixed(4)} ${ccy}${fxDate ? `, ${fxDate}` : ''}). The actual margin the tenant realises will vary by ±2-3% based on the PSP / bank conversion applied at settlement.`;
          marginLine = `<span class="line margin ${cls}" title="${opsEsc(tip)}">
            <span class="l">Tenant Margin <span class="est-tag">est.</span></span>
            <span class="v est-val" title="${opsEsc(tip)}">${sign}${opsUSD(Math.abs(margin))} <span class="ccy">${opsEsc(ccy)}</span><span class="est-info" aria-hidden="true">ⓘ</span></span>
          </span>`;
        } else {
          marginLine = `<span class="line margin" title="Tenant store sells in ${opsEsc(ccy)} — today's FX rate isn't available, so margin can't be estimated. Try again later."><span class="l">Tenant Margin</span><span class="v" style="color:#94a3b8;font-weight:700;">—</span></span>`;
        }
      }
    }

    return `
      <div class="oq-row-price">
        ${sellsLine}
        <span class="line"><span class="l">Product</span><span class="v">${prod}</span></span>
        <span class="line"><span class="l">Shipping</span><span class="v">${ship}</span></span>
        <span class="line is-total"><span class="l">Drop Sigma</span><span class="v">${opsUSD(tot)}</span></span>
        ${marginLine}
      </div>`;
  }

  function assigneeColumn(o){
    return o.assignee
      ? `<div class="av" style="background:${opsEsc(o.assignee_color||'#6366f1')}">${initials(o.assignee)}</div>
         <div class="nm">${opsEsc(o.assignee)}</div>`
      : `<div class="av">?</div><div class="nm">Unassigned</div>`;
  }

  function actionsForStatus(o){
    const open = `<button class="ops-btn ghost" data-action="open" data-id="${o.id}">Open</button>`;
    switch (o.sourcing_status){
      case 'pending_source':
        return `<button class="ops-btn primary" data-action="quote" data-id="${o.id}">Quote</button>` + open;
      case 'pending_payment':
        return `<button class="ops-btn ghost" data-action="open" data-id="${o.id}">View quote</button>`;
      case 'processing':
        return `<button class="ops-btn gold" data-action="ship" data-id="${o.id}">Ship</button>` + open;
      case 'shipping':
        return `<button class="ops-btn success" data-action="deliver" data-id="${o.id}">Delivered</button>` + open;
      case 'delivered':
      case 'cancel':
        return open;
      default:
        return open;
    }
  }

  function handleRowAction(act, id){
    if (!window.opsOpenOrderModal) return;
    // All actions route through the modal, opened to the right tab.
    const tabMap = {quote:'quote', ship:'shipping', deliver:'shipping', open:'overview'};
    window.opsOpenOrderModal(id, tabMap[act] || 'overview');
  }

  function renderBulkBar(){
    const wrap = document.getElementById('oqBulkBar');
    if (!wrap) return;
    if (!OQ.selected.size){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="oq-bulk">
        <span class="cnt">${OQ.selected.size} selected</span>
        <button class="ops-btn ghost" id="oqBulkClear" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.15);">Clear</button>
        <span class="sep"></span>
        <button class="ops-btn gold" id="oqBulkAssign">Bulk assign</button>
      </div>`;
    document.getElementById('oqBulkClear').addEventListener('click', () => {
      OQ.selected.clear();
      renderList();
    });
    document.getElementById('oqBulkAssign').addEventListener('click', async () => {
      const ids = Array.from(OQ.selected);
      if (!ids.length){ opsToast('Select at least one order.', 'error'); return; }
      if (typeof window.opsBulkAssignDialog !== 'function'){
        opsToast('Assign modal unavailable — refresh the page.', 'error'); return;
      }
      // Hand off to the polished modal — same widget the order detail uses.
      // After the user submits, the modal calls our onDone callback to clear
      // selection and reload the list.
      window.opsBulkAssignDialog(ids, () => {
        OQ.selected.clear();
        loadOrders();
      });
    });
  }

  /* ─── Tiny helpers ──────────────────────────────────────────────── */
  function initials(s){
    s = (s||'').trim();
    if (!s) return '?';
    const parts = s.split(/\s+/).slice(0,2);
    return parts.map(p => p[0] || '').join('').toUpperCase() || s.slice(0,2).toUpperCase();
  }
})();
</script>

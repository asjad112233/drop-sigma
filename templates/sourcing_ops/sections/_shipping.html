<!-- Shipping desk — Two tabs:
       Ready to dispatch (processing + procurement_status=ready)
       In transit (shipping)
     Includes inline Dispatch modal so we don't depend on the Queue
     agent's full detail modal. -->
<style>
  /* ─── Shipping · scoped styles ────────────────────────────────── */
  #opsShippingRoot .sp-tabs{display:flex;gap:6px;background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:14px;padding:6px;margin-bottom:14px;width:fit-content;box-shadow:0 1px 0 rgba(15,23,42,.02),0 8px 24px -20px rgba(15,23,42,.16);}
  #opsShippingRoot .sp-tab{padding:8px 16px;border-radius:10px;font-size:12.5px;font-weight:800;color:#475569;cursor:pointer;letter-spacing:.005em;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:all .12s ease;}
  #opsShippingRoot .sp-tab:hover{background:#f8fafc;}
  #opsShippingRoot .sp-tab.active{background:linear-gradient(135deg,#0a0b16 0%,#1a1b35 100%);color:#fff;box-shadow:0 6px 16px -10px rgba(15,23,42,.6);}
  #opsShippingRoot .sp-tab .ct{background:rgba(244,196,48,.18);color:#7a5a00;font-size:10.5px;font-weight:900;padding:1px 7px;border-radius:999px;}
  #opsShippingRoot .sp-tab.active .ct{background:rgba(244,196,48,.3);color:#f4c430;}

  #opsShippingRoot .sp-list{display:flex;flex-direction:column;gap:10px;}
  #opsShippingRoot .sp-row{background:#fff;border:1px solid rgba(15,23,42,.06);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;box-shadow:0 1px 0 rgba(15,23,42,.02),0 12px 32px -22px rgba(15,23,42,.18);transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;}
  #opsShippingRoot .sp-row:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(15,23,42,.02),0 18px 36px -20px rgba(15,23,42,.25);border-color:rgba(99,102,241,.3);}
  #opsShippingRoot .sp-thumb{width:60px;height:60px;border-radius:12px;background:linear-gradient(135deg,#f1f5f9,#e2e8f0) center/cover no-repeat;border:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px;color:#94a3b8;flex-shrink:0;}
  #opsShippingRoot .sp-main{min-width:0;display:flex;flex-direction:column;gap:6px;}
  #opsShippingRoot .sp-top-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  #opsShippingRoot .sp-ds{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;color:#7a5a00;letter-spacing:.01em;}
  #opsShippingRoot .sp-cust{font-size:13px;font-weight:800;color:#0f172a;}
  #opsShippingRoot .sp-addr{font-size:11.5px;font-weight:600;color:#64748b;line-height:1.55;}
  #opsShippingRoot .sp-prod-line{font-size:12.5px;font-weight:700;color:#334155;}
  #opsShippingRoot .sp-tracking{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;}
  #opsShippingRoot .sp-tracking .carrier{font-weight:800;color:#0f172a;padding:2px 8px;border-radius:999px;background:#eef2ff;border:1px solid rgba(99,102,241,.18);}
  #opsShippingRoot .sp-tracking .num{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:#475569;background:#f8fafc;padding:2px 8px;border-radius:6px;border:1px solid #e5e7eb;}
  #opsShippingRoot .sp-tracking .copy{cursor:pointer;color:#7c3aed;font-weight:800;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid rgba(124,58,237,.2);background:#fff;}
  #opsShippingRoot .sp-tracking .copy:hover{background:#f5f3ff;}
  #opsShippingRoot .sp-tracking a{color:#6366f1;font-weight:800;text-decoration:underline;}

  #opsShippingRoot .sp-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}

  #opsShippingRoot .sp-empty{padding:60px 20px;text-align:center;color:#64748b;background:#fff;border:1px dashed rgba(15,23,42,.1);border-radius:16px;}
  #opsShippingRoot .sp-empty .ic{font-size:42px;margin-bottom:10px;background:linear-gradient(135deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  #opsShippingRoot .sp-empty h3{font-size:16px;font-weight:900;margin:0 0 4px;color:#0f172a;}
  #opsShippingRoot .sp-empty p{margin:0;font-size:13px;}

  /* ─── Dispatch modal ──────────────────────────────────────────── */
  #spModal{position:fixed;inset:0;z-index:9000;background:rgba(10,11,22,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:spFade .18s ease both;}
  @keyframes spFade{from{opacity:0;}to{opacity:1;}}
  #spModal.hidden{display:none;}
  #spModal .sp-card{background:#fff;border-radius:20px;max-width:540px;width:100%;box-shadow:0 30px 80px -20px rgba(10,11,22,.6),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden;animation:spPop .22s cubic-bezier(.18,.86,.4,1.12) both;}
  @keyframes spPop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
  #spModal .sp-card-head{padding:18px 22px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(15,23,42,.06);background:linear-gradient(180deg,#fff,#fafbff);}
  #spModal .sp-card-head .ti{font-size:16px;font-weight:900;color:#0f172a;letter-spacing:-.015em;}
  #spModal .sp-card-head .sub{font-size:11.5px;color:#64748b;font-weight:700;margin-top:2px;}
  #spModal .sp-card-head .x{margin-left:auto;background:transparent;border:0;font-size:18px;color:#64748b;cursor:pointer;padding:6px;border-radius:8px;}
  #spModal .sp-card-head .x:hover{background:#f1f5f9;color:#0f172a;}
  #spModal .sp-card-body{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
  #spModal label{display:block;font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
  #spModal input,#spModal select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#fff;font-size:13px;font-weight:600;color:#0f172a;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
  #spModal input:focus,#spModal select:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.14);}
  #spModal .sp-card-foot{padding:14px 22px 18px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid rgba(15,23,42,.06);background:#fafbff;}
  #spModal .sp-order-banner{padding:10px 14px;border-radius:12px;background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(99,102,241,.06));border:1px solid rgba(212,175,55,.22);display:flex;flex-direction:column;gap:3px;font-size:12px;}
  #spModal .sp-order-banner .ds{font-family:ui-monospace,Menlo,monospace;font-weight:900;color:#7a5a00;font-size:12.5px;}
  #spModal .sp-order-banner .who{font-weight:700;color:#0f172a;}
</style>

<div id="opsShippingRoot">
  <div class="ops-loading">Loading Shipping desk…</div>
</div>

<!-- Dispatch modal (always present; toggled) -->
<div id="spModal" class="hidden" onclick="if(event.target===this) window.__spCloseModal()">
  <div class="sp-card" role="dialog" aria-modal="true">
    <div class="sp-card-head">
      <div>
        <div class="ti">✈️ Dispatch order</div>
        <div class="sub">Add carrier + tracking and notify the tenant.</div>
      </div>
      <button class="x" onclick="window.__spCloseModal()" aria-label="Close">✕</button>
    </div>
    <div class="sp-card-body">
      <div id="spOrderBanner" class="sp-order-banner"></div>
      <div>
        <label for="spCarrier">Carrier</label>
        <select id="spCarrier" onchange="window.__spCarrierChanged()">
          <option value="DHL Express">DHL Express</option>
          <option value="FedEx">FedEx</option>
          <option value="UPS">UPS</option>
          <option value="Aramex">Aramex</option>
          <option value="Yuntrack">Yuntrack</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label for="spTracking">Tracking number</label>
        <input id="spTracking" type="text" placeholder="e.g. 1234567890" oninput="window.__spCarrierChanged()">
      </div>
      <div>
        <label for="spUrl">Tracking URL (auto-filled when possible)</label>
        <input id="spUrl" type="text" placeholder="https://…">
      </div>
    </div>
    <div class="sp-card-foot">
      <button class="ops-btn ghost" onclick="window.__spCloseModal()">Cancel</button>
      <button class="ops-btn primary" id="spSubmit" onclick="window.__spSubmit()">Submit dispatch</button>
    </div>
  </div>
</div>

<script>
  (function(){
    const SP = {
      tab: 'ready',        // ready | transit
      ready: [],           // processing + procurement_status=ready
      transit: [],         // shipping
      dispatchOrderId: null,
    };

    const TRACK_URL_TEMPLATES = {
      'DHL Express': n => `https://www.dhl.com/global-en/home/tracking/tracking-express.html?submit=1&tracking-id=${encodeURIComponent(n)}`,
      'FedEx':       n => `https://www.fedex.com/fedextrack/?trknbr=${encodeURIComponent(n)}`,
      'UPS':         n => `https://www.ups.com/track?tracknum=${encodeURIComponent(n)}`,
      'Aramex':      n => `https://www.aramex.com/track/results?ShipmentNumber=${encodeURIComponent(n)}`,
      'Yuntrack':    n => `https://www.yuntrack.com/parcelTracking?id=${encodeURIComponent(n)}`,
      'Other':       () => '',
    };

    function esc(s){ return (window.opsEsc || (x => String(x==null?'':x)))(s); }

    function fmtAddress(o){
      const a = o.shipping_address || {};
      const parts = [
        a.address1 || a.line1,
        a.address2 || a.line2,
        [a.city || o.ship_city, a.province || a.state, a.zip || a.postal_code].filter(Boolean).join(', '),
        a.country_name || a.country || o.ship_country,
      ].filter(Boolean);
      if (parts.length) return parts.join(' · ');
      // fallback
      const city = o.ship_city || '';
      const country = o.ship_country || '';
      return [city, country].filter(Boolean).join(' · ') || 'Address on file';
    }

    function openModal(orderId){
      const list = SP.ready.concat(SP.transit);
      const o = list.find(x => x.id === orderId);
      if (!o){ opsToast('Order not found', 'error'); return; }
      SP.dispatchOrderId = orderId;
      document.getElementById('spOrderBanner').innerHTML = `
        <div class="ds">${esc(o.ds_order_ref)}</div>
        <div class="who">${esc(o.customer_name || 'Customer')} · ${esc(o.ship_city || o.ship_country || '')}</div>
        <div style="color:#64748b;">${esc(o.product_name || 'Product')} × ${o.item_count || 1}</div>
      `;
      document.getElementById('spCarrier').value = 'DHL Express';
      document.getElementById('spTracking').value = '';
      document.getElementById('spUrl').value = '';
      document.getElementById('spModal').classList.remove('hidden');
    }
    function closeModal(){
      SP.dispatchOrderId = null;
      document.getElementById('spModal').classList.add('hidden');
    }
    function carrierChanged(){
      const carrier = document.getElementById('spCarrier').value;
      const num = document.getElementById('spTracking').value.trim();
      const urlField = document.getElementById('spUrl');
      // Only auto-fill if user hasn't pasted a different URL
      const fn = TRACK_URL_TEMPLATES[carrier];
      if (fn && num){
        urlField.value = fn(num);
      } else if (fn && !num){
        urlField.value = '';
      }
    }
    async function submitDispatch(){
      const id = SP.dispatchOrderId;
      if (!id) return;
      const carrier  = document.getElementById('spCarrier').value;
      const tracking = document.getElementById('spTracking').value.trim();
      const url      = document.getElementById('spUrl').value.trim();
      if (!tracking){ opsToast('Tracking number required', 'error'); return; }
      const btn = document.getElementById('spSubmit');
      btn.disabled = true; btn.textContent = 'Submitting…';
      const resp = await opsFetch('/ops/api/order/' + id + '/ship/', {
        method: 'POST',
        body: { tracking_number: tracking, tracking_company: carrier, tracking_url: url }
      });
      btn.disabled = false; btn.textContent = 'Submit dispatch';
      if (resp.ok){
        opsToast('Order dispatched', 'success');
        closeModal();
        loadShipping();
      } else if (resp.status === 501) {
        opsToast('Ship endpoint not ready yet', 'error');
      } else {
        opsToast((resp.data && resp.data.error) || 'Could not dispatch', 'error');
      }
    }

    async function markDelivered(orderId, ev){
      ev && ev.stopPropagation();
      const resp = await opsFetch('/ops/api/order/' + orderId + '/deliver/', {
        method: 'POST', body: {}
      });
      if (resp.ok){
        opsToast('Marked delivered', 'success');
        loadShipping();
      } else if (resp.status === 501) {
        opsToast('Deliver endpoint not ready yet', 'error');
      } else {
        opsToast((resp.data && resp.data.error) || 'Could not update', 'error');
      }
    }

    function copyTracking(text, ev){
      ev && ev.stopPropagation();
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(() => opsToast('Tracking copied', 'success'));
      } else {
        opsToast('Clipboard unavailable', 'error');
      }
    }

    function openOrder(orderId){
      if (typeof window.opsOpenOrderModal === 'function'){
        window.opsOpenOrderModal(orderId);
      }
    }

    function renderTabs(){
      const tw = document.getElementById('spTabs');
      if (!tw) return;
      tw.innerHTML = `
        <span class="sp-tab ${SP.tab==='ready'?'active':''}"   data-t="ready">📦 Ready to dispatch <span class="ct">${SP.ready.length}</span></span>
        <span class="sp-tab ${SP.tab==='transit'?'active':''}" data-t="transit">✈️ In transit <span class="ct">${SP.transit.length}</span></span>
      `;
      tw.querySelectorAll('.sp-tab').forEach(el => {
        el.addEventListener('click', () => { SP.tab = el.dataset.t; renderTabs(); renderList(); });
      });
    }

    function renderList(){
      const wrap = document.getElementById('spList');
      if (!wrap) return;
      const list = SP.tab === 'ready' ? SP.ready : SP.transit;
      if (!list.length){
        wrap.innerHTML = `
          <div class="sp-empty">
            <div class="ic">${SP.tab==='ready'?'📦':'✈️'}</div>
            <h3>${SP.tab==='ready'?'Nothing ready to dispatch':'Nothing in transit'}</h3>
            <p>${SP.tab==='ready'?'Procurement will move orders here once they\'re ready.':'Shipped orders will appear here.'}</p>
          </div>`;
        return;
      }
      wrap.innerHTML = '<div class="sp-list">' + list.map(o => {
        const thumb = o.product_image_url
          ? `<div class="sp-thumb" style="background-image:url(${esc(o.product_image_url)});"></div>`
          : `<div class="sp-thumb">📦</div>`;
        if (SP.tab === 'ready'){
          const addr = fmtAddress(o);
          return `
            <div class="sp-row">
              ${thumb}
              <div class="sp-main">
                <div class="sp-top-line">
                  <span class="sp-ds">${esc(o.ds_order_ref)}</span>
                  <span class="sp-cust">${esc(o.flag || '')} ${esc(o.customer_name || 'Customer')}</span>
                </div>
                <div class="sp-prod-line">${esc(o.product_name || 'Product')} × ${o.item_count || 1}</div>
                <div class="sp-addr">${esc(addr)}${o.customer_phone ? ' · ☎ '+esc(o.customer_phone) : ''}</div>
              </div>
              <div class="sp-actions">
                <button class="ops-btn primary sm" onclick="window.__spDispatch(${o.id})">Dispatch</button>
              </div>
            </div>`;
        } else {
          const tnum = o.tracking_number || '';
          const tcarrier = o.tracking_company || '';
          const turl = o.tracking_url || '';
          return `
            <div class="sp-row" onclick="window.__spOpen(${o.id})">
              ${thumb}
              <div class="sp-main">
                <div class="sp-top-line">
                  <span class="sp-ds">${esc(o.ds_order_ref)}</span>
                  <span class="sp-cust">${esc(o.flag || '')} ${esc(o.customer_name || 'Customer')}</span>
                </div>
                <div class="sp-prod-line">${esc(o.product_name || 'Product')} × ${o.item_count || 1}</div>
                <div class="sp-tracking">
                  ${tcarrier ? `<span class="carrier">${esc(tcarrier)}</span>` : ''}
                  ${tnum ? `<span class="num">${esc(tnum)}</span>
                            <button class="copy" onclick="window.__spCopy('${esc(tnum).replace(/'/g, "\\'")}', event)">Copy</button>` : '<span style="color:#94a3b8;font-style:italic;">No tracking yet</span>'}
                  ${turl ? `<a href="${esc(turl)}" target="_blank" onclick="event.stopPropagation();">Track ↗</a>` : ''}
                </div>
              </div>
              <div class="sp-actions" onclick="event.stopPropagation();">
                <button class="ops-btn success sm" onclick="window.__spDelivered(${o.id}, event)">Mark Delivered</button>
              </div>
            </div>`;
        }
      }).join('') + '</div>';
    }

    function renderShell(){
      const root = document.getElementById('opsShippingRoot');
      root.innerHTML = `
        <div id="spTabs" class="sp-tabs"></div>
        <div id="spList"><div class="ops-loading">Loading orders…</div></div>
      `;
    }

    async function loadShipping(){
      // Two parallel requests: ready (processing+ready) and transit (shipping)
      const [respReady, respTransit] = await Promise.all([
        opsFetch('/ops/api/orders/?status=processing&procurement_status=ready'),
        opsFetch('/ops/api/orders/?status=shipping'),
      ]);

      function pickList(r){
        if (!r.ok) return null;
        const items = (r.data && (r.data.orders || r.data.results || r.data.items)) || [];
        return Array.isArray(items) ? items : [];
      }

      const readyList = pickList(respReady);
      const transitList = pickList(respTransit);

      const queueUnavailable = (!respReady.ok && (respReady.status === 501 || respReady.status === 404)) ||
                               (!respTransit.ok && (respTransit.status === 501 || respTransit.status === 404));

      if (queueUnavailable){
        SP.ready = []; SP.transit = [];
        renderTabs();
        const wrap = document.getElementById('spList');
        if (wrap){
          wrap.innerHTML = `<div class="sp-empty"><div class="ic">⏳</div><h3>Loading from Queue desk…</h3><p>Order list endpoint isn&#39;t ready yet. Shipping will activate as soon as it&#39;s online.</p></div>`;
        }
        return;
      }

      if (readyList === null && transitList === null){
        SP.ready = []; SP.transit = [];
        renderTabs();
        const wrap = document.getElementById('spList');
        if (wrap){
          wrap.innerHTML = `<div class="sp-empty"><div class="ic">⚠️</div><h3>Could not load</h3><p>Try refreshing in a moment.</p></div>`;
        }
        return;
      }

      // Defensive client-side filter for ready (in case backend ignores procurement_status param)
      SP.ready   = (readyList   || []).filter(o => (o.procurement_status === 'ready') || o.sourcing_status === 'processing' && o.procurement_status === 'ready');
      // If backend honored the filter, the above is a no-op. If not, only ready ones survive.
      // Guard against an over-eager filter: if backend returned items and our filter zeroed them out,
      // fall back to procurement_status==='ready' OR sourcing_status==='processing'.
      if ((readyList || []).length && !SP.ready.length){
        SP.ready = (readyList || []).filter(o => o.procurement_status === 'ready');
      }
      SP.transit = transitList || [];

      renderTabs();
      renderList();
    }

    window.__spDispatch     = openModal;
    window.__spCloseModal   = closeModal;
    window.__spCarrierChanged = carrierChanged;
    window.__spSubmit       = submitDispatch;
    window.__spDelivered    = markDelivered;
    window.__spCopy         = copyTracking;
    window.__spOpen         = openOrder;

    window.opsLoadShipping = function(){
      renderShell();
      loadShipping();
    };
  })();
</script>

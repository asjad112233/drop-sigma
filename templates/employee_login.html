<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee sign in — Drop Sigma</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#FAFBFD;--surface:#FFFFFF;--border:#E5E9F2;--border-2:#EFF2F8;
  --ink:#0B1224;--ink-2:#1E293B;--ink-3:#475569;--ink-4:#94A3B8;
  --indigo:#6366F1;--purple:#A855F7;--cyan:#06B6D4;--red:#EF4444;
}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;background:var(--bg);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;line-height:1.5;
  position:relative;overflow-x:hidden;
}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none;animation:floatBlob 18s ease-in-out infinite;}
.blob1{width:520px;height:520px;background:radial-gradient(circle,rgba(6,182,212,.45),transparent 70%);top:-180px;left:-160px;}
.blob2{width:480px;height:480px;background:radial-gradient(circle,rgba(99,102,241,.45),transparent 70%);bottom:-160px;right:-160px;animation-delay:-9s;}
@keyframes floatBlob{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(30px,20px) scale(1.05);}}

.card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:22px;
  width:100%;max-width:460px;padding:32px 30px 28px;
  box-shadow:0 30px 70px -30px rgba(15,23,42,.22),0 0 0 1px rgba(99,102,241,.04);
  animation:cardIn .5s cubic-bezier(.2,.7,.2,1.05);
}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}

.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.brand-logo{
  position:relative;width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--cyan),var(--indigo),var(--purple));color:#fff;
  display:grid;place-items:center;font-weight:900;font-size:13px;letter-spacing:-.5px;
  box-shadow:0 8px 18px -6px rgba(99,102,241,.55);overflow:hidden;
}
.brand-logo::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.4), transparent);animation:brandShine 4s linear infinite;}
@keyframes brandShine{to{transform:rotate(360deg);}}
.brand-name{font-size:16px;font-weight:900;color:var(--ink);letter-spacing:-.012em;}
.brand-tag{font-size:11px;color:var(--ink-4);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}

h1{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.022em;margin-bottom:4px;}
.sub{font-size:13.5px;color:var(--ink-3);margin-bottom:20px;}

.error{
  background:linear-gradient(135deg,rgba(239,68,68,.06),rgba(239,68,68,.02));
  border:1px solid rgba(239,68,68,.28);color:#991b1b;font-size:13px;font-weight:600;
  padding:11px 14px;border-radius:11px;margin-bottom:14px;
  display:flex;align-items:flex-start;gap:8px;
}
.error::before{content:"⚠";flex-shrink:0;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
.field input{
  width:100%;padding:12px 14px;
  background:#FAFBFD;border:1.5px solid var(--border);border-radius:11px;
  font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);outline:none;transition:all .15s;
}
.field input::placeholder{color:var(--ink-4);font-weight:500;}
.field input:focus{background:#fff;border-color:var(--indigo);box-shadow:0 0 0 4px rgba(99,102,241,.10);}

.login-btn{
  width:100%;padding:13px;margin-top:6px;
  background:linear-gradient(135deg,var(--cyan),var(--indigo),var(--purple));color:#fff;
  border:0;border-radius:11px;cursor:pointer;
  font-family:inherit;font-weight:800;font-size:14px;letter-spacing:.01em;
  box-shadow:0 10px 24px -8px rgba(99,102,241,.55),inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;overflow:hidden;transition:all .15s;
}
.login-btn::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s;}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px rgba(99,102,241,.65);}
.login-btn:hover::before{transform:translateX(100%);}

.footer{margin-top:20px;padding-top:18px;border-top:1px solid var(--border-2);text-align:center;font-size:13px;color:var(--ink-3);font-weight:600;}
.footer a{color:var(--indigo);font-weight:800;text-decoration:none;}
.footer a:hover{text-decoration:underline;}

@media (max-width:520px){
  body{padding:16px;}
  .card{padding:26px 22px 22px;border-radius:18px;}
  h1{font-size:19px;}
}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important;transition:none !important;}}
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<div class="card">
  <div class="brand">
    <div class="brand-logo">DS</div>
    <div class="brand-text">
      <div class="brand-name">Drop Sigma</div>
      <div class="brand-tag">Employee portal</div>
    </div>
  </div>

  <h1>Welcome back</h1>
  <div class="sub">Sign in to your employee account.</div>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/employee/login/">
    {% csrf_token %}
    <div class="field">
      <label>Email address</label>
      <input type="email" name="email" placeholder="your@email.com" value="{{ email|default:'' }}" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="login-btn">Sign in →</button>
  </form>

  <div class="footer">
    Not an employee? <a href="/">Back to Admin</a>
  </div>
</div>
</body>
</html>
